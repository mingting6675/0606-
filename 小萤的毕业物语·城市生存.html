function useItem(itemId){
  const def=USABLE_ITEMS[itemId];
  if(!def||GS.gameOver)return;
  GS.usedItems=GS.usedItems||{};
  if(GS.usedItems[itemId]===GS.day){showToast('今天已经用过啦');return}
  applyActivityFx(def.fx);
  GS.usedItems[itemId]=GS.day;
  showToast(def.icon+' '+def.name+'：'+fxSummary(def.fx));
  renderAll();saveGame();renderBackpack();checkEndings();
}

function checkEndings(){
  checkAchievements();
  checkFreeGoals();
  if(GS.gameOver)return;
  if(GS.stamina<=0){
    // 体力耗尽：软性恢复（回家休息，几乎无惩罚），养成模式下不再打断游戏
    GS.stamina=50;
    GS.mood=clamp(GS.mood-2,0,100);
    GS.currentLocation='home';
    GS.selectedDest=null;
    addLog('😵 体力透支，你回家好好睡了一觉');
    showToast('😵 体力耗尽！回家休息，体力恢复到 50（心情-2）');
    renderAll();saveGame();
  }
  if(GS.mood<=0)triggerEnding('mood');
  else if(GS.money<0)triggerEnding('money');
}

function checkAchievements(){
  GS.achievements=GS.achievements||[];
  ACHIEVEMENTS.forEach(a=>{
    if(GS.achievements.includes(a.id))return;
    try{
      if(a.cond()){
        GS.achievements.push(a.id);
        if(a.reward)applyActivityFx(a.reward);
        showToast('🏅 解锁成就：'+a.icon+' '+a.name+(a.reward?' · 奖励 '+fxSummary(a.reward):''));
      }
    }catch(e){}
  });
}

  ov.classList.toggle('hidden');
}

function renderAchievements(){

  }).join('');
}

function checkBondMilestones(){
  const bonds=GS.bonds||{};
  GS.bondMilestones=GS.bondMilestones||{};
  const pending=[];
  Object.keys(BOND_EVENTS).forEach(npc=>{
    const v=bonds[npc]||0;
    [40,60,80].forEach(th=>{
      const key=npc+'_'+th;
      if(v>=th&&!GS.bondMilestones[key]){
        GS.bondMilestones[key]=true;
        const ev=BOND_EVENTS[npc][th];
        if(ev)pending.push(ev);
      }
    });
  });
  pending.forEach((ev,i)=>{
    setTimeout(()=>{
      if(GS.gameOver)return;
      showToast(`💞 羁绊升华 · ${ev.speaker==='同事阿凯'?'阿凯':ev.speaker}`);
      startDialogue(ev,()=>{renderAll();saveGame();checkEndings()});
    },600+i*600);
  });
}
function toggleBonds(){
  const ov=document.getElementById('bond-overlay');
  if(ov.classList.contains('hidden'))renderBonds();
  ov.classList.toggle('hidden');
}
function renderBonds(){
  const bonds=GS.bonds||{};
  document.getElementById('bond-grid').innerHTML=Object.keys(BOND_META).map(n=>{
    const v=clamp(bonds[n]||0,0,100);
    const m=BOND_META[n];
    const heart=v>=80?'❤️':v>=60?'💛':v>=30?'💚':'🤍';
    return `<div class="bond-card">
      <div class="bond-avatar">${m.avatar}</div>
      <div class="bond-body">
        <div class="bond-name">${heart} ${n}</div>
        <div class="bond-desc">${m.desc}</div>
        <div class="bond-bar"><div class="bond-fill" style="width:${v}%;background:${m.color}"></div></div>
        <div class="bond-val">羁绊 ${v}/100</div>
      </div>
    </div>`;
  }).join('');
}
function toggleGuide(){
  const ov=document.getElementById('guide-overlay');
  if(ov.classList.contains('hidden'))renderGuide();
  ov.classList.toggle('hidden');
}
function renderGuide(){
  const visited=GS.visitedLocations||[];
  const ids=Object.keys(SCENES);
  const unlocked=ids.filter(id=>visited.includes(id));
  document.getElementById('guide-count').textContent=`已解锁 ${unlocked.length}/${ids.length} · 每到一个新地点，就点亮一张知识卡`;

  // 探索成就联动进度
  const achList=[
    {icon:'🧠',name:'科普爱好者',target:6},
    {icon:'🗺️',name:'城市探索家',target:14},
  ];
  document.getElementById('guide-ach').innerHTML=achList.map(a=>{
    const cur=Math.min(unlocked.length,a.target);
    const done=unlocked.length>=a.target;
    const pct=Math.round(cur/a.target*100);
    return `<div class="guide-ach-card ${done?'done':''}">
      <div class="guide-ach-top"><span class="ga-ic">${a.icon}</span>${a.name}<span class="ga-st">${done?'已达成 🏅':cur+' / '+a.target}</span></div>
      <div class="guide-ach-bar"><div class="guide-ach-fill" style="width:${pct}%"></div></div>
    </div>`;
  }).join('');

  document.getElementById('guide-grid').innerHTML=ids.map(id=>{
    const scene=SCENES[id];
    if(visited.includes(id)){
      const idx=visited.indexOf(id);
      let badge='';
      if(idx===5)badge=`<div class="guide-badge">🧠 科普爱好者</div>`;
      else if(idx===13)badge=`<div class="guide-badge">🗺️ 城市探索家</div>`;
      return `<div class="guide-card">
        <div class="guide-icon">${scene.realArt}</div>
        <div class="guide-body">
          <div class="guide-name">${scene.name}</div>
          <div class="guide-desc">${scene.realDesc}</div>
        </div>
        ${badge}
      </div>`;
    }
    return `<div class="guide-card locked">
      <div class="guide-icon">🔒</div>
      <div class="guide-body">
        <div class="guide-name">？？？</div>
        <div class="guide-lock">尚未探索——去这座城市里走走吧</div>
      </div>
    </div>`;
  }).join('');
}
function triggerEnding(type){
  GS.endingType=type;GS.gameOver=true;if(animFrame2){cancelAnimationFrame(animFrame2);animFrame2=null}

  let e;
  if(type==='story'){
    e=getStoryEnding();
  }else{
    const endings={
      stamina:{icon:'💔',title:'体力耗尽 — 小萤累倒了',cls:'bad',desc:'连续的奔波让小萤的体力彻底耗尽。她瘫坐在路边，导盲杖从手中滑落。<br><br>视障人士的每一次出行，都是一场对身体极限的考验。也许她需要学会更好地休息。'},

      money:{icon:'💸',title:'身无分文 — 小萤被困住了',cls:'bad',desc:'出行的高昂成本让小萤措手不及。口袋里一分钱都不剩了。<br><br>在这个城市里，没有钱寸步难行，对视障人士更是如此。她需要更精细地规划预算。'}
    };
    e=endings[type]||endings.stamina;
  }
  document.getElementById('end-icon2').textContent=e.icon;
  const t=document.getElementById('end-title2');t.textContent=e.title;t.className='et '+e.cls;
  document.getElementById('end-desc2').innerHTML=e.desc;
  const load=calcLoad();
  document.getElementById('end-stats2').innerHTML=`
    <div class="er"><span>🚶 出行次数</span><span>${GS.travelsCompleted} 次</span></div>
    <div class="er"><span>💬 触发对话</span><span>${GS.totalEventsTriggered} 次</span></div>
    <div class="er"><span>🧭 场景探索</span><span>${GS.scenariosDone||0} 次</span></div>
    <div class="er"><span>❤️ 剩余体力</span><span>${GS.stamina}/100</span></div>
    <div class="er"><span>💰 剩余金钱</span><span>¥${GS.money}</span></div>
    <div class="er"><span>😊 最终心情</span><span>${GS.mood}/100</span></div>
    <div class="er"><span>🎒 背包负重</span><span>${load.toFixed(1)}kg</span></div>
    <div class="er"><span>📅 游玩天数</span><span>${GS.freeMode?('第 '+GS.day+' 天'):(Math.min(GS.day,28)+'/28 天')}</span></div>
    <div class="er"><span>💼 职业去向</span><span>${(GS.storyFlags&&GS.storyFlags.position)?GS.storyFlags.position:'—'}</span></div>
    <div class="er"><span>🧭 成长路线</span><span>${GS.growthRoute?(GROWTH_ROUTES[GS.growthRoute].icon+' '+GROWTH_ROUTES[GS.growthRoute].name):'—'}</span></div>
    <hr style="border-color:#2a2a48;margin:6px 0">
    <div class="er"><span>🔍 感知</span><span>${GS.perception}</span></div>
    <div class="er"><span>🛠️ 工具使用</span><span>${GS.toolUse}</span></div>
    <div class="er"><span>💬 沟通</span><span>${GS.communication}</span></div>
    <hr style="border-color:#2a2a48;margin:6px 0">
    <div class="er"><span>💪 自信</span><span>${GS.confidence}</span></div>
    <div class="er"><span>🎓 专业</span><span>${GS.skill}</span></div>
    <div class="er"><span>🤝 社交</span><span>${GS.social}</span></div>
    <div class="er"><span>🕊️ 独立</span><span>${GS.independence}</span></div>
  `;
  saveGame();
}

function init(){
  const hasSave=!!loadGame();document.getElementById('btn-cont2').style.display=hasSave?'inline-block':'none';
  previewAttr=rollAttributes();updatePreview();
  drawAnimeGirl(document.getElementById('start-char-canvas'),1.6,'happy');
  const saved=loadGame();
  if(saved&&saved.gameOver){GS=saved;document.getElementById('screen-start').classList.add('hidden');document.getElementById('screen-game').classList.add('hidden');document.getElementById('screen-ending').classList.remove('hidden');triggerEnding(saved.endingType||'story');GS.gameOver=true;saveGame()}
}
