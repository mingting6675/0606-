<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小萤的毕业物语 · 城市生存</title>
<style>
/* ===== 全局 ===== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Microsoft YaHei','PingFang SC',sans-serif;
  background:#1a1a28;color:#d0c8b8;overflow:hidden;
  user-select:none;-webkit-user-select:none;height:100vh;
}
button{cursor:pointer;border:none;outline:none;font-family:inherit;transition:all .2s}
button:hover{filter:brightness(1.08);transform:translateY(-1px)}

/* ===== 首页 ===== */
#screen-start{
  position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 50% 30%,#2a2a44 0%,#141420 70%);
}
#screen-start.hidden{display:none}
.start-char-container{position:relative;margin-bottom:20px}
#start-char-canvas{display:block}
.start-title{
  font-size:2em;font-weight:700;letter-spacing:.05em;margin-bottom:4px;
  background:linear-gradient(180deg,#f0d080,#c09050);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.start-sub{color:#7878a0;font-size:.9em;margin-bottom:28px}
.attr-row2{display:flex;gap:10px;margin-bottom:20px}
.attr-chip{
  background:#1e1e38;border:1px solid #333350;border-radius:14px;
  padding:10px 18px;text-align:center;min-width:80px;
}
.attr-chip .ac-icon{font-size:22px;display:block}
.attr-chip .ac-val{font-size:1.5em;font-weight:700;color:#f0c060;display:block}
.attr-chip .ac-lbl{font-size:.75em;color:#888;display:block}
.btn-gold{
  background:linear-gradient(135deg,#c08040,#a06030);color:#fff;
  font-size:1.05em;padding:12px 36px;border-radius:24px;
  box-shadow:0 4px 18px rgba(192,128,64,.2);margin:4px;
}
.btn-ghost{
  background:transparent;color:#9080a0;font-size:.9em;
  padding:8px 24px;border-radius:18px;border:1px solid #333350;margin:4px;
}

/* ===== 主游戏页 ===== */
#screen-game{position:fixed;inset:0;display:flex;flex-direction:column}
#screen-game.hidden{display:none}

/* 顶部栏 */
#top-bar{
  display:flex;justify-content:space-between;align-items:center;
  padding:6px 16px;background:#18182a;z-index:10;border-bottom:1px solid#252540;
}
#top-bar .tb-left{display:flex;align-items:center;gap:12px}
#clock2{font-size:1.2em;font-weight:700;color:#f0c060;font-family:'SF Mono',Consolas,monospace}
#day2{background:#282848;color:#a098c0;padding:2px 10px;border-radius:10px;font-size:.8em}
#loc2{color:#888;font-size:.85em}
#top-bar .tb-right{display:flex;gap:4px}
#top-bar .tb-right button{
  background:#202038;color:#9090b0;font-size:.8em;padding:5px 10px;border-radius:12px;
}

/* 成长属性条 */
#growth-bar{
  display:flex;align-items:center;gap:16px;padding:5px 16px;
  background:#14142a;border-bottom:1px solid#252540;z-index:9;flex-wrap:wrap;
}
.gr-item{font-size:.78em;color:#999;display:flex;align-items:center;gap:4px}
.gr-item .grv{color:#f0c060;font-weight:700}
.gr-stage{margin-left:auto;font-size:.78em;color:#7ac870;background:#1e2e24;padding:3px 12px;border-radius:12px}

/* 中间区域 flex */
#game-mid{flex:1;display:flex;overflow:hidden}

/* Canvas 地图 */
#map-wrap{flex:1;position:relative;min-width:0}
#map-canvas2{display:block;width:100%;height:100%}

/* 角色+对话区 */
#char-zone{
  width:380px;background:#1c1c30;display:flex;flex-direction:column;
  border-left:1px solid #2a2a44;overflow:hidden;
}
/* 角色展示 */
#char-display{
  flex:1;display:flex;align-items:center;justify-content:center;
  position:relative;background:radial-gradient(ellipse at 50% 70%,#252540 0%,#181828 100%);
}
#char-display canvas{display:block}
.char-name-tag{
  position:absolute;bottom:8px;left:50%;transform:translateX(-50%);
  background:#2a2a48;color:#c0b090;padding:3px 14px;border-radius:10px;font-size:.8em;
}
/* 对话气泡预览 */
#dialogue-preview{
  min-height:60px;padding:12px 16px;background:#202038;
  border-top:1px solid #2a2a44;font-size:.85em;color:#b0a898;
  display:flex;align-items:center;gap:8px;
}
#dialogue-preview .dp-avatar{
  width:36px;height:36px;border-radius:50%;background:#3a3a58;
  display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;
}
#dialogue-preview .dp-text{flex:1;line-height:1.4}
#dialogue-preview .dp-hint{color:#7878a0;font-size:.75em}

/* 底部状态栏 */
#bottom-bar2{
  display:flex;align-items:center;gap:8px;padding:8px 14px;
  background:#18182a;border-top:1px solid#252540;z-index:10;flex-wrap:wrap;
}
.bb-pill{
  display:flex;align-items:center;gap:4px;background:#202038;
  border-radius:16px;padding:5px 12px;font-size:.82em;white-space:nowrap;
}
.bb-pill .bbv{font-weight:700}
.bb-pill .bbv.gd{color:#7ac870}.bb-pill .bbv.wn{color:#f0c060}.bb-pill .bbv.bd{color:#d87060}
.bb-pill.sta{border-left:3px solid#5cb85c}
.bb-pill.mny{border-left:3px solid#f0c060}
.bb-pill.mod{border-left:3px solid#5bc0de}
.bb-pill.lod{border-left:3px solid#d9534f}
.bb-sel{
  background:#202038;color:#c0b090;border:1px solid#333350;
  border-radius:16px;padding:6px 14px;font-size:.82em;font-family:inherit;
}
.bb-go{
  background:linear-gradient(135deg,#7ac870,#5a9a50);color:#fff;
  padding:7px 20px;border-radius:16px;font-size:.88em;
}

/* ===== 场景对比卡 ===== */
#scene-card{
  position:fixed;inset:0;z-index:150;
  background:rgba(8,8,18,.88);display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(6px);animation:fadeIn2 .4s ease;
}
#scene-card.hidden{display:none}
@keyframes fadeIn2{from{opacity:0}to{opacity:1}}
.sc-card-inner{
  background:#1e1e38;border:1px solid#3a3a58;border-radius:20px;
  padding:24px;max-width:700px;width:94%;text-align:center;
}
.sc-card-inner h2{color:#f0c060;margin-bottom:4px;font-size:1.2em}
.sc-card-inner .sc-sub{color:#888;font-size:.85em;margin-bottom:16px}
.sc-compare{display:flex;gap:12px;margin-bottom:18px}
.sc-panel{
  flex:1;border-radius:14px;padding:16px;text-align:center;min-height:180px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.sc-panel.anime{background:linear-gradient(180deg,#2a3050,#1e2840);border:1px solid#4a5080}
.sc-panel.reality{background:linear-gradient(180deg,#282820,#1e1e18);border:1px solid#4a4a38}
.sc-panel .sc-label{font-size:.75em;margin-bottom:8px;padding:2px 10px;border-radius:8px}
.sc-panel.anime .sc-label{background:#3a4070;color:#a0b0e0}
.sc-panel.reality .sc-label{background:#4a4030;color:#c0a880}
.sc-panel .sc-art{font-size:56px;margin:8px 0}
.sc-panel .sc-desc{font-size:.8em;color:#999;line-height:1.5}
.sc-continue{
  background:linear-gradient(135deg,#c08040,#a06030);color:#fff;
  padding:10px 32px;border-radius:20px;font-size:.95em;
}
/* 地点可做的事 */
.sc-activities{margin-bottom:16px;text-align:left}
.sc-act-hint{font-size:.8em;color:#a098b8;margin-bottom:8px;text-align:center}
.sc-act-btn{
  display:flex;align-items:center;gap:10px;width:100%;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.12);
  border-radius:12px;padding:8px 14px;margin-bottom:8px;cursor:pointer;
  color:#e0d8c8;text-align:left;transition:.2s;font-family:inherit;
}
.sc-act-btn:hover{background:rgba(255,255,255,.08);border-color:#f0c060}
.sc-act-btn:disabled{opacity:.4;cursor:not-allowed}
.sc-act-btn:disabled:hover{background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.12)}
.act-icon{font-size:1.4em;flex:0 0 auto}
.act-body{display:flex;flex-direction:column;gap:2px;min-width:0}
.act-name{font-size:.9em;font-weight:bold;color:#f4d080}
.act-desc{font-size:.76em;color:#a098b8;line-height:1.35}
.act-meta{font-size:.68em;color:#7a8a6a}
.act-none{color:#666;font-size:.8em;text-align:center;margin-bottom:16px}

/* ===== 剧情叙事弹窗 ===== */
#story-overlay{
  position:fixed;inset:0;z-index:155;
  background:rgba(8,8,18,.9);display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(6px);animation:fadeIn2 .4s ease;
}
#story-overlay.hidden{display:none}
.story-inner{
  background:#1e1e38;border:1px solid#3a3a58;border-radius:20px;
  padding:28px;max-width:560px;width:92%;text-align:center;
}
.story-badge{
  display:inline-block;background:#2a2a48;color:#f0c060;padding:4px 16px;
  border-radius:14px;font-size:.85em;margin-bottom:16px;
}
.story-text{
  color:#d0c8b8;line-height:2;font-size:.95em;margin-bottom:22px;
  white-space:pre-wrap;text-align:left;
}
.route-choices{display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
.route-btn{
  display:flex;align-items:center;gap:12px;text-align:left;
  background:#2a2a48;border:1px solid#3a3a58;border-radius:14px;
  padding:12px 16px;color:#ece7dc;cursor:pointer;width:100%;
  font-size:.92em;transition:all .2s;font-family:inherit;
}
.route-btn:hover{border-color:#f0b429;background:#33335a;transform:translateY(-1px)}
.route-icon{font-size:1.5em;flex-shrink:0}
.route-name{font-weight:bold;color:#f0c060;white-space:nowrap}
.route-label{color:#c8c0b0;font-size:.9em;line-height:1.4}

/* ===== 对话弹窗（沉浸式角色场景） ===== */
#dialogue-overlay{
  position:fixed;inset:0;z-index:160;
  background:rgba(4,4,14,.92);display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  animation:fadeIn2 .3s ease;
}
#dialogue-overlay.hidden{display:none}
#dlg-scene-canvas{display:block;border-radius:16px;max-width:95vw;max-height:65vh}
#dlg-ui-layer{width:100%;max-width:780px;padding:0 16px;text-align:center}
#dlg-responses{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;justify-content:center}
.dlg-resp-btn{
  flex:1;min-width:140px;max-width:250px;padding:10px 14px;background:#252545;
  color:#d0c8b8;border:1px solid#383858;border-radius:14px;font-size:.85em;
  text-align:left;transition:all .2s;cursor:pointer;
}
.dlg-resp-btn:hover{border-color:#f0c060;background:#2a2a4e;transform:translateY(-2px)}
.dlg-resp-btn .dr-hint{color:#7878a0;font-size:.75em;display:block;margin-top:2px}
.dlg-click-hint{color:#606080;font-size:.75em;margin-top:8px;animation:blink 1.5s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:.4}50%{opacity:1}}

/* ===== Toast ===== */
#toast{
  position:fixed;top:50px;left:50%;transform:translateX(-50%);
  background:#2a2a48;color:#d0c8b8;padding:7px 18px;
  border-radius:16px;z-index:300;opacity:0;transition:opacity .3s;
  pointer-events:none;font-size:.85em;
}
#toast.show{opacity:1}

/* ===== 背包/日志面板 ===== */
#panel-backpack,#panel-log{
  position:fixed;top:0;width:300px;height:100%;z-index:170;
  background:#1a1a30;padding:24px;overflow-y:auto;transition:transform .35s ease;
}
#panel-backpack{right:0;border-left:1px solid#303050;transform:translateX(100%)}
#panel-backpack.open{transform:translateX(0)}
#panel-log{left:0;border-right:1px solid#303050;transform:translateX(-100%)}
#panel-log.open{transform:translateX(0)}
#panel-backpack h3,#panel-log h3{color:#f0c060;margin-bottom:12px;font-size:1.05em}
.bp-item-card2{
  background:#222240;border-radius:10px;padding:10px 12px;margin-bottom:6px;
  border:1px solid#2a2a46;
}
.bp-item-card2 .iname{font-weight:600;font-size:.9em}
.bp-item-card2 .idesc{font-size:.78em;color:#888}
.bp-item-card2 .iwt{font-size:.75em;color:#d87060}
.iuse{margin-top:8px;display:inline-block;background:#2a3a5a;color:#a0c0e0;padding:4px 10px;border-radius:8px;font-size:.75em;cursor:pointer;border:none;font-family:inherit}
.iuse:hover{background:#3a4a6a}
.iuse.disabled{background:#333;color:#777;cursor:not-allowed}
.log-line2{padding:7px 0;border-bottom:1px solid#252540;font-size:.82em}
.log-line2 .lts{color:#666;margin-right:6px;font-size:.8em}
.pclose{width:100%;margin-top:14px;background:#282848;color:#a0a0c0;padding:10px;border-radius:12px}

/* ===== 成就面板 ===== */
#ach-overlay{
  position:fixed;inset:0;z-index:180;display:flex;align-items:center;justify-content:center;
  background:rgba(8,8,18,.88);backdrop-filter:blur(6px);animation:fadeIn2 .3s ease;
}
#ach-overlay.hidden{display:none}
.ach-inner{
  background:#1e1e38;border:1px solid#3a3a58;border-radius:20px;padding:24px;
  max-width:680px;width:94%;max-height:82vh;overflow-y:auto;text-align:center;
}
.ach-inner h2{color:#f0c060;margin-bottom:4px;font-size:1.2em}
.ach-sub{color:#888;font-size:.85em;margin-bottom:16px}
#ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;text-align:left}
.ach-card{
  background:#222240;border:1px solid#2a2a46;border-radius:12px;padding:12px;
  display:flex;gap:10px;align-items:flex-start;
}
.ach-card.locked{opacity:.45;filter:grayscale(1)}
.ach-icon{font-size:1.6em;flex:0 0 auto}
.ach-name{font-weight:600;font-size:.9em;color:#f4d080}
.ach-desc{font-size:.75em;color:#999;line-height:1.4;margin-top:2px}

/* ===== 羁绊面板 ===== */
#bond-overlay{
  position:fixed;inset:0;z-index:181;display:flex;align-items:center;justify-content:center;
  background:rgba(8,8,18,.88);backdrop-filter:blur(6px);animation:fadeIn2 .3s ease;
}
#bond-overlay.hidden{display:none}
.bond-inner{
  background:#1e1e38;border:1px solid#3a3a58;border-radius:20px;padding:24px;
  max-width:560px;width:94%;max-height:82vh;overflow-y:auto;text-align:center;
}
.bond-inner h2{color:#f0c060;margin-bottom:4px;font-size:1.2em}
.bond-sub{color:#888;font-size:.85em;margin-bottom:16px}
#bond-grid{display:flex;flex-direction:column;gap:12px;text-align:left}
.bond-card{background:#222240;border:1px solid#2a2a46;border-radius:12px;padding:14px;display:flex;gap:12px;align-items:center}
.bond-avatar{font-size:2em;flex:0 0 auto}
.bond-body{flex:1}
.bond-name{font-weight:600;font-size:.95em;color:#f4d080}
.bond-desc{font-size:.75em;color:#999;margin:2px 0 8px}
.bond-bar{height:8px;background:#16162c;border-radius:6px;overflow:hidden}
.bond-fill{height:100%;border-radius:6px;transition:width .4s ease}
.bond-val{font-size:.75em;color:#c0b090;text-align:right;margin-top:2px}

/* ===== 科普图鉴 ===== */
#guide-overlay{
  position:fixed;inset:0;z-index:182;display:flex;align-items:center;justify-content:center;
  background:rgba(8,8,18,.88);backdrop-filter:blur(6px);animation:fadeIn2 .3s ease;
}
#guide-overlay.hidden{display:none}
.guide-inner{
  background:#1e1e38;border:1px solid#3a3a58;border-radius:20px;padding:24px;
  max-width:640px;width:94%;max-height:82vh;overflow-y:auto;text-align:center;
}
.guide-inner h2{color:#f0c060;margin-bottom:4px;font-size:1.2em}
.guide-sub{color:#888;font-size:.85em;margin-bottom:16px}
#guide-grid{display:flex;flex-direction:column;gap:10px;text-align:left}
.guide-card{background:#222240;border:1px solid#2a2a46;border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start}
.guide-card.locked{opacity:.55}
.guide-icon{font-size:1.6em;flex:0 0 auto;line-height:1.2}
.guide-body{flex:1}
.guide-name{font-weight:600;font-size:.95em;color:#f4d080}
.guide-desc{font-size:.78em;color:#b8b0a0;line-height:1.6;margin-top:4px}
.guide-lock{font-size:.75em;color:#888;margin-top:4px}
.guide-ach{display:flex;gap:10px;margin-bottom:16px}
.guide-ach-card{flex:1;background:#1a1a32;border:1px solid#2a2a46;border-radius:12px;padding:10px 12px;text-align:left}
.guide-ach-card.done{border-color:#f0c060;background:#24203c}
.guide-ach-top{display:flex;align-items:center;gap:6px;font-size:.82em;color:#d8c8a0;margin-bottom:7px}
.guide-ach-top .ga-ic{font-size:1.15em}
.guide-ach-top .ga-st{margin-left:auto;font-size:.72em;color:#888;white-space:nowrap}
.guide-ach-card.done .ga-st{color:#f0c060}
.guide-ach-bar{height:6px;background:#0e0e20;border-radius:3px;overflow:hidden}
.guide-ach-fill{height:100%;background:linear-gradient(90deg,#7ac870,#f0c060);border-radius:3px;transition:width .4s ease}
.guide-badge{flex:0 0 auto;font-size:.72em;color:#f0c060;background:#2a2438;border:1px solid#f0c060;border-radius:999px;padding:3px 8px;white-space:nowrap;margin-top:2px}

/* ===== 结局页 ===== */
#screen-ending{
  position:fixed;inset:0;z-index:250;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 50% 40%,#202040,#101020 70%);
  text-align:center;padding:40px 20px;
}
#screen-ending.hidden{display:none}
#screen-ending .ei{font-size:64px;margin-bottom:12px}
#screen-ending .et{font-size:1.7em;font-weight:700;margin-bottom:10px}
#screen-ending .et.good{color:#7ac870}
#screen-ending .et.bad{color:#d87060}
#screen-ending .ed{max-width:460px;color:#a098b8;line-height:1.8;margin-bottom:20px}
#screen-ending .es{
  background:#1a1a34;border-radius:14px;padding:18px 28px;margin-bottom:24px;
  text-align:left;min-width:280px;border:1px solid#2a2a48;
}
#screen-ending .es .er{display:flex;justify-content:space-between;margin:4px 0;font-size:.88em}

/* 响应式 */
@media(max-width:750px){
  #char-zone{width:180px}
  #char-display canvas{transform:scale(.7)}
  .sc-compare{flex-direction:column}
  #dlg-portrait{width:70px;height:90px;font-size:40px}
}
@media(max-width:500px){
  #game-mid{flex-direction:column}
  #char-zone{width:100%;flex-direction:row;height:140px}
  #char-display{flex:0 0 100px}
  #dialogue-preview{flex:1}
  #map-wrap{height:200px}
}

/* ===== 视觉打磨 v2 ===== */
:root{
  --gold:#f0c060;--gold-deep:#a06030;--green:#7ac870;
  --line:#2a2a46;--line-soft:#3a3a58;
}
/* 自定义滚动条 */
.guide-inner::-webkit-scrollbar,.ach-inner::-webkit-scrollbar,.bond-inner::-webkit-scrollbar,#panel-backpack::-webkit-scrollbar,#panel-log::-webkit-scrollbar{width:8px}
.guide-inner::-webkit-scrollbar-thumb,.ach-inner::-webkit-scrollbar-thumb,.bond-inner::-webkit-scrollbar-thumb,#panel-backpack::-webkit-scrollbar-thumb,#panel-log::-webkit-scrollbar-thumb{background:#3a3a58;border-radius:4px}
.guide-inner::-webkit-scrollbar-thumb:hover,.ach-inner::-webkit-scrollbar-thumb:hover,.bond-inner::-webkit-scrollbar-thumb:hover{background:#4a4a6a}
/* 首页氛围 */
#screen-start{background:radial-gradient(ellipse at 50% 22%,#35355e 0%,#1b1b32 46%,#0f0f18 100%)}
.start-title{text-shadow:0 2px 24px rgba(240,192,96,.3)}
.attr-chip{background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));backdrop-filter:blur(4px);box-shadow:0 2px 12px rgba(0,0,0,.3);transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease}
.attr-chip:hover{transform:translateY(-2px);border-color:#4a4a6a}
/* 主按钮质感 */
.btn-gold,.bb-go,.sc-continue{box-shadow:0 4px 16px rgba(192,128,64,.28),0 2px 4px rgba(0,0,0,.3)}
.btn-gold:hover,.bb-go:hover,.sc-continue:hover{box-shadow:0 6px 24px rgba(192,128,64,.42),0 3px 6px rgba(0,0,0,.35)}
.btn-ghost:hover{background:rgba(255,255,255,.06);border-color:#4a4a6a;color:#c0b0d0}
/* 顶部栏工具按钮 */

</style>
</head>

<script>
// ============================================================
// 角色绘制 (CSS Canvas 替代 - 直接在 Canvas 上绘制动漫女孩)
// ============================================================
function drawAnimeGirl(canvas, scale, expression) {
  scale = scale || 1; expression = expression || 'neutral';
  const c = canvas.getContext('2d');
  const s = scale;
  // Use a larger base coordinate system
  const W = 200 * s, H = 280 * s;
  canvas.width = W; canvas.height = H;
  c.clearRect(0, 0, W, H);
  // Center at 100*s horizontally
  const cx = 100 * s;

  // Helper: draw filled circle
  function circ(x, y, r) { c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill(); }
  // Helper: draw filled ellipse
  function ellip(x, y, rx, ry, rot) { c.beginPath(); c.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2); c.fill(); }

  // === GROUND SHADOW ===
  c.fillStyle = 'rgba(0,0,0,0.18)';
  ellip(cx, 260*s, 50*s, 8*s);

  // === LEGS ===
  c.fillStyle = '#fce4cc';
  c.fillRect(cx-14*s, 200*s, 12*s, 40*s);
  c.fillRect(cx+2*s, 200*s, 12*s, 40*s);
  // White stockings
  c.fillStyle = '#fff';
  c.fillRect(cx-14*s, 215*s, 12*s, 22*s);
  c.fillRect(cx+2*s, 215*s, 12*s, 22*s);
  // Pink shoes with yellow trim
  c.fillStyle = '#f8b0c0';
  c.fillRect(cx-16*s, 238*s, 14*s, 8*s);
  c.fillRect(cx+0*s, 238*s, 14*s, 8*s);
  c.fillStyle = '#fcd878';
  c.fillRect(cx-15*s, 239*s, 12*s, 2*s);
  c.fillRect(cx+1*s, 239*s, 12*s, 2*s);
  // Shoe toes
  c.fillStyle = '#f8b0c0';
  ellip(cx-9*s, 246*s, 8*s, 3*s);
  ellip(cx+9*s, 246*s, 8*s, 3*s);

  // === DRESS (pink gradient qipao style) ===
  const dressGrad = c.createLinearGradient(0, 130*s, 0, 210*s);
  dressGrad.addColorStop(0, '#fdd8e4');
  dressGrad.addColorStop(0.35, '#fcc0d4');
  dressGrad.addColorStop(0.7, '#f8a8c0');
  dressGrad.addColorStop(1, '#f090b4');
  c.fillStyle = dressGrad;
  c.beginPath();
  c.moveTo(cx-22*s, 110*s);
  c.quadraticCurveTo(cx-28*s, 150*s, cx-24*s, 195*s);
  c.quadraticCurveTo(cx-18*s, 210*s, cx-4*s, 212*s);
  c.quadraticCurveTo(cx, 215*s, cx+4*s, 212*s);
  c.quadraticCurveTo(cx+18*s, 210*s, cx+24*s, 195*s);
  c.quadraticCurveTo(cx+28*s, 150*s, cx+22*s, 110*s);
  c.closePath();
  c.fill();
  // Dress shading lines
  c.strokeStyle = '#e898b0'; c.lineWidth = 0.5*s;
  c.beginPath(); c.moveTo(cx-16*s, 140*s); c.quadraticCurveTo(cx-20*s, 170*s, cx-15*s, 205*s); c.stroke();
  c.beginPath(); c.moveTo(cx+16*s, 140*s); c.quadraticCurveTo(cx+20*s, 170*s, cx+15*s, 205*s); c.stroke();
  c.beginPath(); c.moveTo(cx, 130*s); c.lineTo(cx, 210*s); c.stroke();

  // === YELLOW BELT + BOW ===
  c.fillStyle = '#fcd878';
  c.fillRect(cx-26*s, 128*s, 52*s, 10*s);
  c.fillStyle = '#f8c860';
  c.fillRect(cx-26*s, 128*s, 52*s, 2*s);
  c.fillRect(cx-26*s, 136*s, 52*s, 2*s);
  // Side bows
  c.fillStyle = '#fcd878';
  c.beginPath(); c.moveTo(cx-26*s, 130*s);
  c.quadraticCurveTo(cx-38*s, 118*s, cx-30*s, 136*s);
  c.quadraticCurveTo(cx-28*s, 142*s, cx-26*s, 136*s);
  c.closePath(); c.fill();
  c.beginPath(); c.moveTo(cx+26*s, 130*s);
  c.quadraticCurveTo(cx+38*s, 118*s, cx+30*s, 136*s);
  c.quadraticCurveTo(cx+28*s, 142*s, cx+26*s, 136*s);
  c.closePath(); c.fill();
  // Center bow knot
  c.fillStyle = '#fcd878';
  circ(cx, 133*s, 5*s);
  c.fillStyle = '#f8c860';
  circ(cx, 132*s, 3*s);

  // === UPPER BODY ===
  const topGrad = c.createLinearGradient(0, 80*s, 0, 110*s);
  topGrad.addColorStop(0, '#fdd8e4');
  topGrad.addColorStop(1, '#fcc0d4');
  c.fillStyle = topGrad;
  c.beginPath();
  c.moveTo(cx-16*s, 72*s);
  c.quadraticCurveTo(cx-22*s, 90*s, cx-22*s, 110*s);
  c.lineTo(cx+22*s, 110*s);
  c.quadraticCurveTo(cx+22*s, 90*s, cx+16*s, 72*s);
  c.closePath();
  c.fill();
  // Neckline
  c.fillStyle = '#fce4cc';
  c.beginPath(); c.arc(cx, 70*s, 11*s, 0, Math.PI * 2); c.fill();
  // Collar bow
  c.fillStyle = '#fcd878';
  c.beginPath(); c.moveTo(cx, 78*s); c.lineTo(cx-7*s, 74*s); c.lineTo(cx-3*s, 80*s); c.lineTo(cx, 78*s); c.closePath(); c.fill();
  c.beginPath(); c.moveTo(cx, 78*s); c.lineTo(cx+7*s, 74*s); c.lineTo(cx+3*s, 80*s); c.lineTo(cx, 78*s); c.closePath(); c.fill();
  circ(cx, 76*s, 3*s);

  // === PUFF SLEEVES ===
  c.fillStyle = '#fcc0d4';
  ellip(cx-24*s, 88*s, 10*s, 14*s, -0.2);
  ellip(cx+24*s, 88*s, 10*s, 14*s, 0.2);
  // Arms
  c.fillStyle = '#fce4cc';
  ellip(cx-22*s, 105*s, 4*s, 16*s, -0.3);
  ellip(cx+22*s, 105*s, 4*s, 16*s, 0.3);
  // Hands
  circ(cx-20*s, 118*s, 4*s);
  circ(cx+20*s, 118*s, 4*s);

  // === HEAD ===
  c.fillStyle = '#fce4cc';
  c.beginPath(); c.arc(cx, 42*s, 32*s, 0, Math.PI * 2); c.fill();
  // Ears
  c.fillStyle = '#f0d0b8';
  ellip(cx-30*s, 42*s, 3.5*s, 6*s);
  ellip(cx+30*s, 42*s, 3.5*s, 6*s);

  // === RABBIT EARS ===
  function drawRabbitEar(baseX, baseY, tipX, tipY) {
    c.fillStyle = '#fce4cc';
    c.strokeStyle = '#e8c0b0'; c.lineWidth = 0.8*s;
    c.beginPath();
    c.moveTo(baseX, baseY);
    c.quadraticCurveTo(tipX - 6*s, tipY + 20*s, tipX, tipY);
    c.quadraticCurveTo(tipX + 6*s, tipY + 20*s, baseX + 10*s, baseY);
    c.lineTo(baseX, baseY);
    c.closePath();
    c.fill(); c.stroke();
    // Inner pink
    c.fillStyle = '#f8b8c8';
    c.beginPath();
    c.moveTo(baseX + 3*s, baseY + 2*s);
    c.quadraticCurveTo(tipX - 2*s, tipY + 15*s, tipX, tipY + 3*s);
    c.quadraticCurveTo(tipX + 2*s, tipY + 15*s, baseX + 7*s, baseY + 2*s);
    c.closePath();
    c.fill();
  }
  drawRabbitEar(cx-14*s, 10*s, cx-24*s, -32*s);
  drawRabbitEar(cx+14*s, 10*s, cx+24*s, -32*s);
  // Ear headband
  c.fillStyle = '#f8b8c8'; c.strokeStyle = '#e8c0b0'; c.lineWidth = 0.6*s;
  c.fillRect(cx-28*s, 8*s, 56*s, 3*s);
  c.strokeRect(cx-28*s, 8*s, 56*s, 3*s);

  // === HAIR ===
  c.fillStyle = '#2a1612';
  // Back of hair
  c.beginPath(); c.arc(cx, 30*s, 33*s, Math.PI, Math.PI * 2); c.fill();
  c.fillRect(cx-33*s, 28*s, 66*s, 16*s);
  // Hair sheen
  c.fillStyle = '#3a2218';
  c.beginPath(); c.ellipse(cx-6*s, 20*s, 14*s, 6*s, -0.1, 0, Math.PI * 2); c.fill();
  c.fillStyle = '#2a1612';

  // Bangs - detailed scalloped edge
  c.beginPath();
  c.moveTo(cx-32*s, 24*s);
  const bangs = [
    [-32, 24], [-30, 32], [-27, 22], [-24, 34],
    [-20, 20], [-16, 33], [-12, 18], [-8, 31],
    [-4, 19], [0, 32], [4, 19], [8, 31],
    [12, 18], [16, 33], [20, 20], [24, 34],
    [27, 22], [30, 32], [32, 24]
  ];
  bangs.forEach(([bx, by], i) => {
    if (i === 0) c.moveTo(cx + bx*s - (bx < -30 ? 2*s : 0), cy(by));
    else c.lineTo(cx + bx*s, by*s);
  });
  c.lineTo(cx + 33*s, 18*s);
  c.lineTo(cx - 33*s, 18*s);
  c.closePath();
  c.fill();

  function cy(y) { return y * s; }

  // Side hair (long flowing)
  c.fillStyle = '#2a1612';
  c.beginPath();
  c.moveTo(cx-30*s, 30*s);
  c.quadraticCurveTo(cx-38*s, 50*s, cx-42*s, 80*s);
  c.quadraticCurveTo(cx-44*s, 110*s, cx-40*s, 145*s);
  c.quadraticCurveTo(cx-36*s, 125*s, cx-35*s, 80*s);
  c.quadraticCurveTo(cx-32*s, 50*s, cx-28*s, 34*s);
  c.closePath();
  c.fill();
  c.beginPath();
  c.moveTo(cx+30*s, 30*s);
  c.quadraticCurveTo(cx+38*s, 50*s, cx+42*s, 80*s);
  c.quadraticCurveTo(cx+44*s, 110*s, cx+40*s, 145*s);
  c.quadraticCurveTo(cx+36*s, 125*s, cx+35*s, 80*s);
  c.quadraticCurveTo(cx+32*s, 50*s, cx+28*s, 34*s);
  c.closePath();
  c.fill();

  // BRAID (left side, thick)
  c.fillStyle = '#2a1612';
  c.beginPath();
  c.moveTo(cx-38*s, 45*s);
  c.quadraticCurveTo(cx-48*s, 70*s, cx-50*s, 100*s);
  c.quadraticCurveTo(cx-52*s, 130*s, cx-46*s, 158*s);
  c.quadraticCurveTo(cx-42*s, 150*s, cx-44*s, 120*s);
  c.quadraticCurveTo(cx-44*s, 85*s, cx-40*s, 60*s);
  c.quadraticCurveTo(cx-36*s, 48*s, cx-36*s, 42*s);
  c.closePath();
  c.fill();
  // Braid segments
  for (let i = 0; i < 6; i++) {
    c.strokeStyle = 'rgba(60, 30, 20, 0.3)'; c.lineWidth = 0.7*s;
    const by = 55*s + i * 18*s;
    c.beginPath();
    c.moveTo(cx-48*s - (i % 2) * 3*s, by);
    c.quadraticCurveTo(cx-44*s, by + 5*s, cx-42*s, by);
    c.stroke();
  }
  // Braid end bow
  c.fillStyle = '#fcd878';
  c.beginPath(); c.moveTo(cx-48*s, 152*s); c.lineTo(cx-58*s, 148*s); c.lineTo(cx-52*s, 158*s); c.closePath(); c.fill();
  c.beginPath(); c.moveTo(cx-48*s, 152*s); c.lineTo(cx-56*s, 162*s); c.lineTo(cx-52*s, 150*s); c.closePath(); c.fill();

  // Hair highlight strands
  c.strokeStyle = 'rgba(80, 50, 40, 0.2)'; c.lineWidth = 0.8*s;
  c.beginPath(); c.moveTo(cx-20*s, 20*s); c.quadraticCurveTo(cx-15*s, 14*s, cx-8*s, 20*s); c.stroke();

  // === EYES ===

  function drawEye(ex, ey, flip) {

    irisGrad.addColorStop(0, '#6a4a32');
    irisGrad.addColorStop(0.5, '#3a1a10');
    irisGrad.addColorStop(0.85, '#1a0808');
    irisGrad.addColorStop(1, '#0a0208');

    // Eyelashes

    for (let i = 0; i < 4; i++) {

      const lx = ex + Math.cos(ang) * 12.5*s;
      const ly = ey + Math.sin(ang) * 12.5*s;

      c.lineTo(lx - 2*s * dir, ly - 2*s);

    c.fillStyle = '#fff';

    {id:'m10',name:'物美超市·找货架',icon:'🛒',cost:20,

      prompt:'你要买牛奶、面包和几包抽纸。超市很大，货架多，导航已经没用了，需要找到对应的区域。',
      choices:[
        {text:'向工作人员问路',ability:'communication',desc:'听附近工作人员的脚步声，上前问乳品区、烘焙区和纸品区分别在哪。',

        {text:'听声闻味自己找',ability:'perception',desc:'听冷藏柜的嗡嗡声找乳品区，闻面包香气找烘焙区，摸抽纸包装判断纸品区。',
          ok:{text:'你循着冷藏柜声音和面包香气找到两个区域，纸品区通过摸到柔软包装判断，最终买齐。',time:4,mood:0},
          no:{text:'超市太大，声音和气味的来源不明确，你在里面绕了很多圈，最后不得不求助工作人员。',time:5,mood:-2}},

    {id:'m11',name:'稻香村·买糕点',icon:'🥮',cost:15,

      prompt:'你想买几样糕点带回去。柜台式售卖需要排队，轮到时报名字，对方帮你称重装盒。',
      choices:[
        {text:'提前想好报名字',ability:'perception',desc:'排队时听前面顾客都买什么，心里有数，轮到时说「我要和前面那位顾客一样的，再加一斤萨其马」。',

        {text:'请售货员推荐',ability:'communication',desc:'说明你看不见，请对方推荐适合自己吃或送人的糕点，并按口味描述帮你选择。',

      atmo:['暖黄色灯光，橱窗里摆满面包和蛋糕。能闻到浓郁的奶香和烘烤味，烤箱定时器的叮声、包装纸沙沙声。'],

    {id:'m13',name:'宜家·香氛区',icon:'🕯️',cost:25,
      atmo:['宜家入口是缓缓上升的扶梯，进去后灯光明亮。香氛区货架整齐，空气里是浓郁混合的香气，有花香、果香、木质调，层次丰富但不刺鼻。'],
      prompt:'你路过香氛区，不知不觉停了下来。香薰蜡烛和香氛瓶太多，每一种味道都不一样，你一个个拿起来闻。',
      choices:[

      ]},
    {id:'m14',name:'宜家·沙发区休息',icon:'🛋️',cost:0,
      atmo:['沙发区摆满样品沙发，地板从硬质过渡到铺了地毯的区域，织物味道变浓。有人试坐发出「好舒服」的感叹。'],
      prompt:'你走了很多路，腿已经很酸。看到满屋子的样品沙发，你找了一张宽敞的布艺沙发坐下，靠背很软。',

      prompt:'你逛完床品区，发现找不到出口了。宜家的路线是单向设计，走错一点就要绕很远，你已经转了几圈。',

        {text:'沿单向路线慢慢找',ability:'perception',desc:'用盲杖贴着通道边缘走，感受地面是否有导向箭头或不同材质的边界。',

          no:{text:'躺了好几分钟也没人理你，有顾客小声议论。你自觉尴尬，默默坐起来继续找路。',time:5,mood:-3}},
        {text:'大声向路人求助',ability:'communication',desc:'听到附近有脚步声，朝对方说「您好，我找不到出口了，能帮帮我吗」。',

          no:{text:'对方说「出口在那边，往前走右拐」，但你无法确定「右拐」后能不能走对，走了一段又迷路了，只好再次求助。',time:4,mood:-2}},

  happyvalley:[
    {id:'h01',name:'入园门口',icon:'🎫',cost:0,

      prompt:'所有闸机都可以凭残疾证直接入园，不需要购票。你准备怎么进去？',
      choices:[
        {text:'选排队最短的闸机',ability:'perception',desc:'听闸机刷卡声的密集程度，判断哪个方向排队人少，用盲杖探路走过去。',

      choices:[
        {text:'循声和阴影找入口',ability:'perception',desc:'辨别尖叫声和引擎声最响亮的方向，用盲杖探索地面材质变化，判断广场和排队区的分界。',

        {text:'向游客或工作人员问路',ability:'communication',desc:'听附近有穿制服的脚步声或对讲机声，向对方询问入口方向。',

      ]},

        {text:'盲杖自己探索',ability:'perception',desc:'用盲杖轻探地面和座椅边缘，沿着过道慢慢走，找到空位入座。',

          no:{text:'出口附近人流密集，声音被冲散。有同伴被别的游客带偏了方向，最后是工作人员帮忙才找到彼此。',time:4,mood:-2}},
        {text:'手机共享位置',ability:'toolUse',desc:'打开手机共享实时位置，通过读屏听取彼此的距离和方向。',

// 绘制带动画的chibi小萤
function drawXiaoyingAnimated(ctx,cx,cy,scale,expr,animTime,isSpeaking){
  ctx.save();ctx.translate(cx,cy);
  const s=scale;
  const breathe=Math.sin(animTime*0.002)*1.5; // 呼吸
  const speakBounce=isSpeaking?Math.sin(animTime*0.015)*3:0; // 说话弹跳
  const totalBounce=breathe+speakBounce;
  const blinkCycle=Math.sin(animTime*0.005);
  const isBlinking=blinkCycle>0.92;

  // === 阴影 ===
  ctx.fillStyle='rgba(0,0,0,.25)';
  ctx.beginPath();ctx.ellipse(0,95*s+totalBounce*0.5,28*s,8*s,0,0,Math.PI*2);ctx.fill();

  // === 鞋子（粉色圆头） ===
  ctx.fillStyle='#f4a8b8';
  ctx.beginPath();ctx.ellipse(-7*s,92*s+totalBounce,7*s,3*s,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(7*s,92*s+totalBounce,7*s,3*s,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#e898a8';ctx.fillRect(-12*s,88*s+totalBounce,10*s,4*s);ctx.fillRect(2*s,88*s+totalBounce,10*s,4*s);

  // === 腿 ===
  ctx.fillStyle='#fce4cc';
  ctx.beginPath();ctx.moveTo(-10*s,70*s+totalBounce);ctx.lineTo(-8*s,90*s+totalBounce);ctx.lineTo(-3*s,90*s+totalBounce);ctx.lineTo(-6*s,70*s+totalBounce);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(6*s,70*s+totalBounce);ctx.lineTo(3*s,90*s+totalBounce);ctx.lineTo(8*s,90*s+totalBounce);ctx.lineTo(10*s,70*s+totalBounce);ctx.closePath();ctx.fill();
  // 袜子
  ctx.fillStyle='#fff';
  ctx.fillRect(-9*s,82*s+totalBounce,8*s,5*s);ctx.fillRect(1*s,82*s+totalBounce,8*s,5*s);

  // === 裙子（粉黄渐变） ===
  const skirtGrad=ctx.createLinearGradient(0,50*s+totalBounce,0,80*s+totalBounce);
  skirtGrad.addColorStop(0,'#fcc8d8');skirtGrad.addColorStop(0.5,'#f8a8c0');skirtGrad.addColorStop(1,'#f090b0');
  ctx.fillStyle=skirtGrad;
  ctx.beginPath();ctx.moveTo(-18*s,50*s+totalBounce);ctx.lineTo(-25*s,72*s+totalBounce);
  ctx.lineTo(-10*s,78*s+totalBounce);ctx.lineTo(0,80*s+totalBounce);
  ctx.lineTo(10*s,78*s+totalBounce);ctx.lineTo(25*s,72*s+totalBounce);
  ctx.lineTo(18*s,50*s+totalBounce);ctx.closePath();ctx.fill();
  // 裙褶
  ctx.strokeStyle='#e898b0';ctx.lineWidth=.6*s;
  ctx.beginPath();ctx.moveTo(-15*s,54*s+totalBounce);ctx.lineTo(-18*s,75*s+totalBounce);ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,55*s+totalBounce);ctx.lineTo(0,80*s+totalBounce);ctx.stroke();
  ctx.beginPath();ctx.moveTo(15*s,54*s+totalBounce);ctx.lineTo(18*s,75*s+totalBounce);ctx.stroke();

  // === 上身（粉色） ===
  ctx.fillStyle='#f8b8c8';
  ctx.beginPath();ctx.moveTo(-15*s,25*s+totalBounce);ctx.lineTo(-18*s,52*s+totalBounce);
  ctx.lineTo(18*s,52*s+totalBounce);ctx.lineTo(15*s,25*s+totalBounce);ctx.closePath();ctx.fill();
  // 领口
  ctx.fillStyle='#f4e4c8';
  ctx.beginPath();ctx.arc(0,24*s+totalBounce,9*s,0,Math.PI*2);ctx.fill();
  // 领结（黄色）
  ctx.fillStyle='#fcd878';
  ctx.beginPath();ctx.moveTo(0,28*s+totalBounce);ctx.lineTo(-6*s,24*s+totalBounce);ctx.lineTo(0,22*s+totalBounce);ctx.lineTo(6*s,24*s+totalBounce);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.arc(0,26*s+totalBounce,3*s,0,Math.PI*2);ctx.fill();
  // 袖子
  ctx.fillStyle='#fce4cc';
  ctx.beginPath();ctx.ellipse(-18*s,38*s+totalBounce,4*s,10*s,-0.2,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(18*s,38*s+totalBounce,4*s,10*s,0.2,0,Math.PI*2);ctx.fill();

  // === 头 ===
  ctx.fillStyle='#fce4cc';
  ctx.beginPath();ctx.arc(0,5*s+totalBounce,22*s,0,Math.PI*2);ctx.fill();
  // 耳朵
  ctx.fillStyle='#f5d8b8';
  ctx.beginPath();ctx.ellipse(-21*s,5*s+totalBounce,4*s,6*s,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(21*s,5*s+totalBounce,4*s,6*s,0,0,Math.PI*2);ctx.fill();

  // === 兔耳发饰 ===
  ctx.fillStyle='#fce4cc';ctx.strokeStyle='#e8c0b0';ctx.lineWidth=.6*s;
  ctx.beginPath();ctx.moveTo(-10*s,-22*s+totalBounce);ctx.quadraticCurveTo(-15*s,-50*s,-7*s,-58*s);ctx.quadraticCurveTo(-3*s,-48*s,-6*s,-22*s+totalBounce);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillStyle='#f8b8c8';ctx.beginPath();ctx.moveTo(-9*s,-24*s+totalBounce);ctx.quadraticCurveTo(-13*s,-44*s,-7*s,-50*s);ctx.quadraticCurveTo(-5*s,-42*s,-7*s,-24*s+totalBounce);ctx.closePath();ctx.fill();
  ctx.fillStyle='#fce4cc';
  ctx.beginPath();ctx.moveTo(10*s,-22*s+totalBounce);ctx.quadraticCurveTo(15*s,-50*s,7*s,-58*s);ctx.quadraticCurveTo(3*s,-48*s,6*s,-22*s+totalBounce);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillStyle='#f8b8c8';ctx.beginPath();ctx.moveTo(9*s,-24*s+totalBounce);ctx.quadraticCurveTo(13*s,-44*s,7*s,-50*s);ctx.quadraticCurveTo(5*s,-42*s,7*s,-24*s+totalBounce);ctx.closePath();ctx.fill();

  // === 头发 ===
  ctx.fillStyle='#2a1612';
  ctx.beginPath();ctx.arc(0,-8*s+totalBounce,23*s,Math.PI,Math.PI*2);ctx.fill();
  ctx.fillRect(-23*s,-8*s+totalBounce,46*s,15*s);
  // 刘海锯齿
  ctx.beginPath();ctx.moveTo(-22*s,-8*s+totalBounce);
  ctx.lineTo(-21*s,4*s+totalBounce);ctx.lineTo(-17*s,-10*s+totalBounce);
  ctx.lineTo(-14*s,6*s+totalBounce);ctx.lineTo(-10*s,-12*s+totalBounce);
  ctx.lineTo(-7*s,5*s+totalBounce);ctx.lineTo(-3*s,-11*s+totalBounce);
  ctx.lineTo(0,6*s+totalBounce);ctx.lineTo(3*s,-11*s+totalBounce);
  ctx.lineTo(7*s,5*s+totalBounce);ctx.lineTo(10*s,-12*s+totalBounce);
  ctx.lineTo(14*s,6*s+totalBounce);ctx.lineTo(17*s,-10*s+totalBounce);
  ctx.lineTo(21*s,4*s+totalBounce);ctx.lineTo(22*s,-8*s+totalBounce);
  ctx.closePath();ctx.fill();
  // 侧发
  ctx.beginPath();ctx.moveTo(-22*s,-7*s+totalBounce);ctx.lineTo(-28*s,10*s+totalBounce);ctx.lineTo(-26*s,28*s+totalBounce);ctx.lineTo(-22*s,18*s+totalBounce);ctx.lineTo(-20*s,5*s+totalBounce);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(22*s,-7*s+totalBounce);ctx.lineTo(28*s,10*s+totalBounce);ctx.lineTo(26*s,28*s+totalBounce);ctx.lineTo(22*s,18*s+totalBounce);ctx.lineTo(20*s,5*s+totalBounce);ctx.closePath();ctx.fill();
  // 长辫子（左侧）
  ctx.beginPath();ctx.moveTo(-24*s,0+totalBounce);ctx.lineTo(-30*s,30*s+totalBounce);ctx.lineTo(-32*s,55*s+totalBounce);ctx.lineTo(-28*s,52*s+totalBounce);ctx.lineTo(-26*s,30*s+totalBounce);ctx.lineTo(-22*s,0+totalBounce);ctx.closePath();ctx.fill();
  // 辫尾蝴蝶结
  ctx.fillStyle='#fcd878';
  ctx.beginPath();ctx.moveTo(-30*s,52*s+totalBounce);ctx.lineTo(-35*s,48*s+totalBounce);ctx.lineTo(-32*s,55*s+totalBounce);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(-30*s,52*s+totalBounce);ctx.lineTo(-35*s,57*s+totalBounce);ctx.lineTo(-32*s,50*s+totalBounce);ctx.closePath();ctx.fill();
  ctx.fillStyle='#2a1612';
  // 头顶光泽
  ctx.fillStyle='rgba(80,50,40,.2)';
  ctx.beginPath();ctx.ellipse(-6*s,-16*s+totalBounce,14*s,5*s,-0.1,0,Math.PI*2);ctx.fill();

  // === 眉毛 ===
  ctx.strokeStyle='#1a0a08';ctx.lineWidth=1.8*s;
  ctx.beginPath();ctx.moveTo(-16*s,-4*s+totalBounce);ctx.lineTo(-8*s,-6*s+totalBounce);ctx.stroke();
  ctx.beginPath();ctx.moveTo(8*s,-6*s+totalBounce);ctx.lineTo(16*s,-4*s+totalBounce);ctx.stroke();

  // === 眼睛 ===
  const eyeY=2*s+totalBounce;
  if(!isBlinking){
    // 眼白
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.ellipse(-10*s,eyeY,8.5*s,9*s,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(10*s,eyeY,8.5*s,9*s,0,0,Math.PI*2);ctx.fill();
    // 虹膜
    const grad1=ctx.createRadialGradient(-10*s,eyeY+1*s,0,-10*s,eyeY+1*s,8*s);
    grad1.addColorStop(0,'#3a2a1a');grad1.addColorStop(0.7,'#1a0a08');grad1.addColorStop(1,'#0a0a1a');
    ctx.fillStyle=grad1;
    ctx.beginPath();ctx.ellipse(-10*s,eyeY+1*s,6.5*s,7*s,0,0,Math.PI*2);ctx.fill();
    const grad2=ctx.createRadialGradient(10*s,eyeY+1*s,0,10*s,eyeY+1*s,8*s);
    grad2.addColorStop(0,'#3a2a1a');grad2.addColorStop(0.7,'#1a0a08');grad2.addColorStop(1,'#0a0a1a');
    ctx.fillStyle=grad2;
    ctx.beginPath();ctx.ellipse(10*s,eyeY+1*s,6.5*s,7*s,0,0,Math.PI*2);ctx.fill();
    // 瞳孔高光
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(-7*s,eyeY-3*s,3*s,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(13*s,eyeY-3*s,3*s,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(-13*s,eyeY+5*s,1.5*s,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(7*s,eyeY+5*s,1.5*s,0,Math.PI*2);ctx.fill();
    // 上睫毛
    ctx.strokeStyle='#1a0a08';ctx.lineWidth=1.5*s;
    ctx.beginPath();ctx.arc(-10*s,eyeY,9*s,Math.PI*1.15,Math.PI*1.85);ctx.stroke();
    ctx.beginPath();ctx.arc(10*s,eyeY,9*s,Math.PI*1.15,Math.PI*1.85);ctx.stroke();
  }else{
    ctx.strokeStyle='#1a0a08';ctx.lineWidth=1.8*s;
    ctx.beginPath();ctx.moveTo(-20*s,eyeY);ctx.lineTo(0,eyeY);ctx.stroke();
    ctx.beginPath();ctx.moveTo(0,eyeY);ctx.lineTo(20*s,eyeY);ctx.stroke();
  }

  // === 鼻子 ===
  ctx.fillStyle='#e8c8a8';ctx.beginPath();ctx.arc(0,10*s+totalBounce,2*s,0,Math.PI*2);ctx.fill();

  // === 嘴 ===
  const mouthY=16*s+totalBounce;
  if(expr==='happy'){
    ctx.fillStyle='#d87070';ctx.beginPath();ctx.arc(0,mouthY+2*s,5*s,0,Math.PI);ctx.fill();
    ctx.fillStyle='#f08080';ctx.beginPath();ctx.arc(0,mouthY+1*s,3*s,0,Math.PI);ctx.fill();
  }else if(expr==='sad'){
    ctx.strokeStyle='#c08080';ctx.lineWidth=1*s;
    ctx.beginPath();ctx.arc(0,mouthY+3*s,4*s,0,Math.PI);ctx.stroke();
  }else if(expr==='worried'){
    ctx.strokeStyle='#c08080';ctx.lineWidth=1*s;
    ctx.beginPath();ctx.moveTo(-4*s,mouthY+2*s);
    ctx.quadraticCurveTo(-2*s,mouthY+4*s,0,mouthY+2*s);
    ctx.quadraticCurveTo(2*s,mouthY+4*s,4*s,mouthY+2*s);ctx.stroke();
  }else if(expr==='surprised'){
    ctx.fillStyle='#d87070';
    ctx.beginPath();ctx.ellipse(0,mouthY+2*s,3*s,4*s,0,0,Math.PI*2);ctx.fill();
  }else if(expr==='tired'){
    ctx.strokeStyle='#c08080';ctx.lineWidth=1*s;
    ctx.beginPath();ctx.moveTo(-3*s,mouthY+2*s);ctx.lineTo(3*s,mouthY+2*s);ctx.stroke();
  }else if(expr==='teary'){
    ctx.strokeStyle='#c08080';ctx.lineWidth=1*s;
    ctx.beginPath();ctx.arc(0,mouthY+3*s,3*s,0,Math.PI);ctx.stroke();
    ctx.fillStyle='rgba(140,190,255,.9)';
    ctx.beginPath();ctx.ellipse(-15*s,mouthY+1*s,2*s,3*s,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(15*s,mouthY+1*s,2*s,3*s,0,0,Math.PI*2);ctx.fill();
  }else if(expr==='shy'){
    ctx.strokeStyle='#c08080';ctx.lineWidth=1*s;
    ctx.beginPath();ctx.arc(0,mouthY+2*s,2.5*s,0.15*Math.PI,0.85*Math.PI);ctx.stroke();
  }else if(expr==='determined'){
    ctx.strokeStyle='#c08080';ctx.lineWidth=1.2*s;
    ctx.beginPath();ctx.moveTo(-3*s,mouthY+2*s);ctx.lineTo(3*s,mouthY+2*s);ctx.stroke();
  }else{
    // 说话时嘴张开
    if(isSpeaking&&Math.sin(animTime*0.03)>0){
      ctx.fillStyle='#c06060';ctx.beginPath();ctx.ellipse(0,mouthY+2*s,4*s,Math.abs(Math.sin(animTime*0.03))*4*s,0,0,Math.PI*2);ctx.fill();
    }else{
      ctx.fillStyle='#d89090';ctx.beginPath();ctx.arc(0,mouthY,2.5*s,0,Math.PI);ctx.fill();
    }
  }

  // === 腮红 ===
  ctx.fillStyle='rgba(240,160,160,.35)';
  ctx.beginPath();ctx.ellipse(-17*s,9*s+totalBounce,5*s,3*s,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(17*s,9*s+totalBounce,5*s,3*s,0,0,Math.PI*2);ctx.fill();

  ctx.restore();
}

// 绘制NPC（带动画）
function drawNPCAnimated(ctx,cx,cy,scale,type,animTime,isSpeaking){
  ctx.save();ctx.translate(cx,cy);
  const s=scale*0.75;
  const breathe=Math.sin(animTime*0.0022)*1.2;
  const speakBounce=isSpeaking?Math.sin(animTime*0.015)*2.5:0;
  const totalBounce=breathe+speakBounce;
  const isBlinking=Math.sin(animTime*0.0053)>0.92;

  // 阴影
  ctx.fillStyle='rgba(0,0,0,.2)';
  ctx.beginPath();ctx.ellipse(0,82*s+totalBounce*0.5,22*s,6*s,0,0,Math.PI*2);ctx.fill();

  // 鞋
  ctx.fillStyle='#3a2820';ctx.fillRect(-9*s,76*s+totalBounce,8*s,4*s);ctx.fillRect(1*s,76*s+totalBounce,8*s,4*s);

  // 腿
  ctx.fillStyle='#fce4cc';
  ctx.fillRect(-8*s,58*s+totalBounce,7*s,20*s);ctx.fillRect(2*s,58*s+totalBounce,7*s,20*s);

  // 身体颜色
  const bodyColors={passerby:'#8899aa',kind_woman:'#d4a0a8',staff:'#5577aa',little_girl:'#f0d870',volunteer:'#cc5544',driver:'#445566',xiaoyu:'#f2c14e',linwei:'#3a4a6b'};
  const bodyClr=bodyColors[type]||'#8899aa';

  // 衣服
  ctx.fillStyle=bodyClr;
  ctx.beginPath();ctx.moveTo(-16*s,30*s+totalBounce);ctx.lineTo(-18*s,58*s+totalBounce);
  ctx.lineTo(18*s,58*s+totalBounce);ctx.lineTo(16*s,30*s+totalBounce);ctx.closePath();ctx.fill();
  // 领口
  ctx.fillStyle='#fce4cc';ctx.beginPath();ctx.arc(0,28*s+totalBounce,7*s,0,Math.PI*2);ctx.fill();

  // 特殊服装
  if(type==='staff'){ctx.fillStyle='#3a5a7a';ctx.fillRect(-14*s,22*s+totalBounce,28*s,5*s)}
  if(type==='volunteer'){ctx.fillStyle='#ee6655';ctx.fillRect(-16*s,40*s+totalBounce,32*s,6*s)}
  if(type==='driver'){ctx.fillStyle='#2a3a4a';ctx.fillRect(-13*s,22*s+totalBounce,26*s,5*s)}
  if(type==='linwei'){ctx.fillStyle='#f2f2f7';ctx.beginPath();ctx.moveTo(0,30*s+totalBounce);ctx.lineTo(-6*s,42*s+totalBounce);ctx.lineTo(6*s,42*s+totalBounce);ctx.closePath();ctx.fill()}

  // 手臂
  ctx.fillStyle='#fce4cc';
  ctx.beginPath();ctx.ellipse(-20*s,40*s+totalBounce,3.5*s,8*s,-.3,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(20*s,40*s+totalBounce,3.5*s,8*s,.3,0,Math.PI*2);ctx.fill();

  // 头
  ctx.fillStyle='#fce4cc';ctx.beginPath();ctx.arc(0,8*s+totalBounce,18*s,0,Math.PI*2);ctx.fill();
  // 耳朵
  ctx.fillStyle='#f0d0b0';ctx.beginPath();ctx.ellipse(-17*s,8*s+totalBounce,3*s,5*s,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(17*s,8*s+totalBounce,3*s,5*s,0,0,Math.PI*2);ctx.fill();

  // 头发颜色和风格
  const hairColors={passerby:'#3a2a1a',kind_woman:'#4a2820',staff:'#1a1a2e',little_girl:'#5a3020',volunteer:'#3a2018',driver:'#2a1a10',xiaoyu:'#6b4028',linwei:'#1a1a24'};
  const hairClr=hairColors[type]||'#3a2a1a';
  ctx.fillStyle=hairClr;
  ctx.beginPath();ctx.arc(0,0+totalBounce,19*s,Math.PI,Math.PI*2);ctx.fill();
  ctx.fillRect(-19*s,0+totalBounce,38*s,12*s);

  // 发型变化
  if(type==='little_girl'){
    ctx.fillStyle=hairClr;ctx.beginPath();ctx.arc(-18*s,10*s+totalBounce,8*s,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(18*s,10*s+totalBounce,8*s,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#f0d870';ctx.beginPath();ctx.arc(-18*s,11*s+totalBounce,3*s,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(18*s,11*s+totalBounce,3*s,0,Math.PI*2);ctx.fill();
  }else if(type==='xiaoyu'){
    // 双马尾 + 蝴蝶结
    ctx.fillStyle=hairClr;ctx.beginPath();ctx.arc(-18*s,6*s+totalBounce,8*s,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(18*s,6*s+totalBounce,8*s,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ee6688';ctx.beginPath();ctx.arc(-18*s,3*s+totalBounce,4*s,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(18*s,3*s+totalBounce,4*s,0,Math.PI*2);ctx.fill();
  }else if(type==='linwei'){
    // 及肩直发（偏长）
    ctx.fillStyle=hairClr;ctx.fillRect(-20*s,-2*s+totalBounce,5*s,24*s);ctx.fillRect(15*s,-2*s+totalBounce,5*s,24*s);
  }else if(type==='kind_woman'){
    ctx.fillStyle=hairClr;ctx.fillRect(-20*s,-2*s+totalBounce,5*s,18*s);ctx.fillRect(15*s,-2*s+totalBounce,5*s,18*s);
  }else{
    ctx.fillStyle=hairClr;ctx.fillRect(-20*s,-1*s+totalBounce,5*s,15*s);ctx.fillRect(15*s,-1*s+totalBounce,5*s,15*s);
  }

  // 帽子（staff/driver）
  if(type==='staff'||type==='driver'){
    ctx.fillStyle='#3a4a5a';ctx.fillRect(-13*s,-4*s+totalBounce,26*s,7*s);
    ctx.fillRect(-18*s,2*s+totalBounce,36*s,3*s);
  }

  // 眼睛
  const ey=6*s+totalBounce;
  if(!isBlinking){
    ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(-7*s,ey,6*s,6.5*s,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(7*s,ey,6*s,6.5*s,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#1a1a2e';ctx.beginPath();ctx.ellipse(-5*s,ey+.5*s,4*s,4.5*s,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(5*s,ey+.5*s,4*s,4.5*s,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-4*s,ey-1.5*s,2*s,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(6*s,ey-1.5*s,2*s,0,Math.PI*2);ctx.fill();
  }else{
    ctx.strokeStyle='#1a0a08';ctx.lineWidth=1.5*s;
    ctx.beginPath();ctx.moveTo(-14*s,ey);ctx.lineTo(0,ey);ctx.stroke();
    ctx.beginPath();ctx.moveTo(0,ey);ctx.lineTo(14*s,ey);ctx.stroke();
  }

  // 眉毛
  ctx.strokeStyle='#1a0a08';ctx.lineWidth=1.5*s;
  ctx.beginPath();ctx.moveTo(-14*s,0+totalBounce);ctx.lineTo(-6*s,-2*s+totalBounce);ctx.stroke();
  ctx.beginPath();ctx.moveTo(6*s,-2*s+totalBounce);ctx.lineTo(14*s,0+totalBounce);ctx.stroke();

  // 眼镜（林薇）
  if(type==='linwei'){
    ctx.strokeStyle='#4a5a6a';ctx.lineWidth=1.2*s;
    ctx.beginPath();ctx.arc(-7*s,6*s+totalBounce,6.5*s,0,Math.PI*2);ctx.stroke();
    ctx.beginPath();ctx.arc(7*s,6*s+totalBounce,6.5*s,0,Math.PI*2);ctx.stroke();
    ctx.beginPath();ctx.moveTo(0,6*s+totalBounce);ctx.lineTo(1*s,6*s+totalBounce);ctx.stroke();
  }

  // 鼻子
  ctx.fillStyle='#e8c8a8';ctx.beginPath();ctx.arc(0,11*s+totalBounce,1.5*s,0,Math.PI*2);ctx.fill();

  // 嘴
  const my=17*s+totalBounce;
  if(isSpeaking&&Math.sin(animTime*0.03)>0){
    ctx.fillStyle='#c06060';ctx.beginPath();ctx.ellipse(0,my+1*s,3*s,Math.abs(Math.sin(animTime*0.03))*3*s,0,0,Math.PI*2);ctx.fill();
  }else{
    ctx.fillStyle='#d89090';ctx.beginPath();ctx.arc(0,my,2*s,0,Math.PI);ctx.fill();
  }

  // 腮红
  ctx.fillStyle='rgba(240,160,160,.28)';
  ctx.beginPath();ctx.ellipse(-14*s,10*s+totalBounce,4*s,2.5*s,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(14*s,10*s+totalBounce,4*s,2.5*s,0,0,Math.PI*2);ctx.fill();

  ctx.restore();
}

// ====== 场景背景 ======
function drawSceneBG(ctx,w,h,locId){
  const palettes={
    home:{top:'#2a2838',btm:'#1a1820',ground:'rgba(35,30,28,.65)'},
    busstop:{top:'#242c38',btm:'#181e24',ground:'rgba(30,34,38,.6)'},
    station:{top:'#262834',btm:'#1a1c26',ground:'rgba(28,30,36,.6)'},
    mall:{top:'#2e2430',btm:'#1c1820',ground:'rgba(32,26,28,.6)'},
    shop:{top:'#242e26',btm:'#182018',ground:'rgba(28,30,26,.6)'},
    hospital:{top:'#283034',btm:'#1a2026',ground:'rgba(30,32,36,.6)'},
    park:{top:'#24302a',btm:'#18201c',ground:'rgba(28,34,28,.6)'},
    library:{top:'#2a2834',btm:'#1c1a24',ground:'rgba(30,28,32,.6)'},
    community:{top:'#302a22',btm:'#201c16',ground:'rgba(34,30,26,.6)'},
    cafe:{top:'#302622',btm:'#1e1a18',ground:'rgba(32,26,22,.6)'},
    bank:{top:'#2a2c34',btm:'#1c1e24',ground:'rgba(30,32,36,.6)'},
    pharmacy:{top:'#243032',btm:'#182024',ground:'rgba(28,32,34,.6)'}
  };
  const pal=palettes[locId]||palettes.home;
  const grad=ctx.createLinearGradient(0,0,0,h);
  grad.addColorStop(0,pal.top);grad.addColorStop(0.75,pal.btm);grad.addColorStop(1,'#12121e');
  ctx.fillStyle=grad;ctx.fillRect(0,0,w,h);
  // 地面
  ctx.fillStyle=pal.ground;ctx.fillRect(0,h*0.75,w,h*0.25);
  ctx.strokeStyle='rgba(255,255,255,.05)';ctx.beginPath();ctx.moveTo(0,h*0.75);ctx.lineTo(w,h*0.75);ctx.stroke();

  // 环境粒子
  const seed=(locId||'a').charCodeAt(0)*137;
  for(let i=0;i<40;i++){
    const px=(i*seed*7+seed*3)%w,py=(i*251+seed)%Math.floor(h*.6);
    const alpha=.02+.03*Math.sin(i*1.7+dlgTime*0.001);
    ctx.fillStyle=`rgba(255,255,255,${alpha})`;
    ctx.beginPath();ctx.arc(px,py+Math.sin(dlgTime*0.0008+i)*4,1.2,0,Math.PI*2);ctx.fill();
  }

  // 浮游光点
  for(let i=0;i<6;i++){
    const fx=((i*173+seed*29)%w),fy=((i*311+seed*17)%h);
    const fa=.06+.04*Math.sin(dlgTime*0.002+i*2);
    ctx.fillStyle=`rgba(244,196,96,${fa})`;
    ctx.beginPath();ctx.arc(fx+Math.cos(dlgTime*0.001+i)*15,fy+Math.sin(dlgTime*0.0015+i)*20,2.5,0,Math.PI*2);ctx.fill();
  }

  // 天气氛围（雨丝 / 风线）
  if(GS&&GS.weather==='rain'){
    ctx.strokeStyle='rgba(160,180,210,.14)';ctx.lineWidth=1;
    for(let i=0;i<28;i++){
      const rx=((i*173+seed*7)%w),ry=((i*277+seed*11)%h);
      const len=8+((i*37)%8);
      ctx.beginPath();ctx.moveTo(rx,ry);ctx.lineTo(rx-2,ry+len);ctx.stroke();
    }
  }else if(GS&&GS.weather==='wind'){
    ctx.strokeStyle='rgba(200,210,180,.10)';ctx.lineWidth=1;
    for(let i=0;i<12;i++){
      const wy=((i*89+seed*3)%h),wx=((i*151+seed*5+dlgTime*1.2)%w);
      ctx.beginPath();ctx.moveTo(wx,wy);ctx.quadraticCurveTo(wx+12,wy-3,wx+24,wy+2);ctx.stroke();
    }
  }

  // 暗角聚焦
  const vg=ctx.createRadialGradient(w/2,h*0.42,w*0.35,w/2,h*0.5,w*0.75);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.38)');
  ctx.fillStyle=vg;ctx.fillRect(0,0,w,h);
}

// ====== 气泡 ======
function drawSpeechBubble(ctx,x,y,w,h,text,speakerName,isNarrator){
  ctx.save();
  const bx=x-w/2,by=y-h;
  // 气泡身体
  const bubbleGrad=ctx.createLinearGradient(bx,by,bx,by+h);
  bubbleGrad.addColorStop(0,isNarrator?'rgba(18,16,28,.94)':'rgba(28,24,42,.94)');
  bubbleGrad.addColorStop(1,isNarrator?'rgba(14,12,22,.94)':'rgba(24,20,36,.94)');
  ctx.fillStyle=bubbleGrad;
  ctx.strokeStyle=isNarrator?'rgba(100,100,120,.35)':'rgba(200,170,130,.25)';
  ctx.lineWidth=1.5;ctx.shadowColor='rgba(0,0,0,.3)';ctx.shadowBlur=8;
  ctx.beginPath();ctx.moveTo(bx+14,by);ctx.lineTo(bx+w-14,by);
  ctx.arcTo(bx+w,by,bx+w,by+14,14);ctx.lineTo(bx+w,by+h-14);
  ctx.arcTo(bx+w,by+h,bx+w-14,by+h,14);ctx.lineTo(bx+14,by+h);
  ctx.arcTo(bx,by+h,bx,by+h-14,14);ctx.lineTo(bx,by+14);
  ctx.arcTo(bx,by,bx+14,by,14);ctx.closePath();ctx.fill();ctx.stroke();
  // 气泡底部点击提示
  if(!isNarrator||currentDialogueStep===1){
    ctx.fillStyle='rgba(255,255,255,.25)';ctx.font='10px "Microsoft YaHei",sans-serif';ctx.textAlign='right';
    ctx.fillText('点击继续 ▸',bx+w-16,by+h-8);
  }

  if(speakerName&&!isNarrator){
    ctx.fillStyle='#f0c060';ctx.font='bold 11px "Microsoft YaHei",sans-serif';ctx.textAlign='left';
    ctx.fillText(speakerName,bx+16,by+18);
    ctx.fillStyle='#d8d0c0';ctx.font='13px "Microsoft YaHei",sans-serif';
    wrapText2(ctx,text,bx+16,by+40,w-32,21,9);
  }else{
    ctx.fillStyle='#c8c0b0';ctx.font='13px "Microsoft YaHei",sans-serif';
    wrapText2(ctx,text,bx+16,by+20,w-32,21,9);
  }
  ctx.restore();
}

function wrapText2(ctx,text,x,y,maxW,lh,maxLines){
  const chars=text.split('');let line='',ly=y,c=0;
  for(let i=0;i<chars.length;i++){
    const t=line+chars[i];
    if(ctx.measureText(t).width>maxW&&line!==''){ctx.fillText(line,x,ly);line=chars[i];ly+=lh;c++;if(c>=maxLines){ctx.fillText(line.substring(0,line.length-2)+'…',x,ly);return}}
    else line=t;
  }
  ctx.fillText(line,x,ly);
}

// ====== 场景渲染主函数 ======
function renderDialogueScene(){
  if(!sceneCtx||!currentDialogue)return;
  const ctx=sceneCtx,w=sceneW,h=sceneH;
  dlgTime++;

  // 背景
  drawSceneBG(ctx,w,h,GS.currentLocation);

  const dlg=currentDialogue;
  const line=currentDialogueStep<dlg.lines.length?dlg.lines[currentDialogueStep]:null;
  const speaker=line?line.who:'小萤';
  const isXiaoying=speaker==='小萤';
  const isNarrator=speaker==='narrator';

  // 角色位置
  const xiaoX=w*0.68,xiaoY=h*0.42;
  const npcX=w*0.32,npcY=h*0.42;

  // NPC类型映射
  const npcTypeMap={路人甲:'passerby',公交司机:'driver',商场保安:'staff',路人:'passerby',好心路人:'kind_woman',地铁工作人员:'staff',小女孩:'little_girl',志愿者:'volunteer',小雨:'xiaoyu',林薇:'linwei',同事阿凯:'staff',图书馆管理员:'kind_woman',视障朋友:'kind_woman',咖啡馆店员:'staff',社区志愿者:'volunteer',好心大姐:'kind_woman',求职伙伴:'passerby',商场保洁:'staff'};
  const npcType=npcTypeMap[dlg.speaker]||'passerby';

  // 入场动画（0-1）
  let entrance=1;
  if(dlgEntrance>0){
    entrance=Math.min(1,dlgEntrance/30);
    dlgEntrance++;
  }

  // 画NPC（带说话标记）
  const npcSpeaking=!isXiaoying&&!isNarrator&&!!line;
  const npcAlpha=entrance;
  ctx.globalAlpha=npcAlpha;
  drawNPCAnimated(ctx,npcX,npcY,1,npcType,dlgTime,npcSpeaking);
  // 说话光晕
  if(npcSpeaking){
    const glowAlpha=.08+.04*Math.sin(dlgTime*0.01);
    ctx.fillStyle=`rgba(255,220,160,${glowAlpha})`;
    ctx.beginPath();ctx.arc(npcX,npcY-20,45,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;

  // 画小萤
  const xiaoSpeaking=isXiaoying&&!!line;
  drawXiaoyingAnimated(ctx,xiaoX,xiaoY,1,line?(line.expr||'neutral'):'neutral',dlgTime,xiaoSpeaking);
  if(xiaoSpeaking){
    const glowAlpha=.08+.04*Math.sin(dlgTime*0.01);
    ctx.fillStyle=`rgba(255,220,160,${glowAlpha})`;
    ctx.beginPath();ctx.arc(xiaoX,xiaoY-25,45,0,Math.PI*2);ctx.fill();
  }

  // 名字标签
  ctx.fillStyle='rgba(0,0,0,.45)';
  const pad=8;
  ctx.font='10px "Microsoft YaHei",sans-serif';ctx.textAlign='center';
  const npcNameW=ctx.measureText(dlg.speaker).width+pad*2;
  ctx.fillRect(npcX-npcNameW/2,npcY+82,npcNameW,18);
  ctx.fillStyle='#c0b090';ctx.fillText(dlg.speaker,npcX,npcY+94);
  const xiaoNameW=ctx.measureText('小萤').width+pad*2;
  ctx.fillRect(xiaoX-xiaoNameW/2,xiaoY+82,xiaoNameW,18);
  ctx.fillStyle='#f0c060';ctx.fillText('小萤',xiaoX,xiaoY+94);

  // 气泡
  if(line){
    const bubbleW=Math.min(360,w*0.8);
    const bubbleH=isNarrator?50:70;
    let bubbleX;
    if(isNarrator)bubbleX=w/2;
    else if(isXiaoying)bubbleX=xiaoX-50;
    else bubbleX=npcX+50;
    const bubbleY=isNarrator?h*0.38:h*0.14;
    drawSpeechBubble(ctx,bubbleX,bubbleY,bubbleW,bubbleH,line.text,isNarrator?null:speaker,isNarrator);
  }

  // 选择画面
  if(currentDialogueStep>=dlg.lines.length){
    const darkGrad=ctx.createLinearGradient(0,h*0.65,0,h);
    darkGrad.addColorStop(0,'rgba(0,0,0,0)');darkGrad.addColorStop(0.4,'rgba(0,0,0,.5)');darkGrad.addColorStop(1,'rgba(0,0,0,.7)');
    ctx.fillStyle=darkGrad;ctx.fillRect(0,h*0.65,w,h*0.35);
    ctx.fillStyle='#f0c060';ctx.font='bold 13px "Microsoft YaHei",sans-serif';ctx.textAlign='center';
    ctx.fillText('「你会怎么做？」',w/2,h*0.78);
  }
}

// ====== 动画循环 ======
function animateDialogueScene(){
  if(!currentDialogue||document.getElementById('dialogue-overlay').classList.contains('hidden')){
    dlgAnimFrame=null;return;
  }
  renderDialogueScene();
  dlgAnimFrame=requestAnimationFrame(animateDialogueScene);
}

// ====== 对话流程 ======
function startDialogue(dialogue,callback){
  currentDialogue=dialogue;currentDialogueStep=0;currentDialogueCallback=callback;
  dlgTime=0;dlgEntrance=1; // 入场动画
  document.getElementById('dlg-responses').innerHTML='';
  document.querySelector('.dlg-click-hint').style.display='block';
  document.getElementById('dialogue-overlay').classList.remove('hidden');
  initSceneCanvas();
  renderDialogueScene();
  if(!dlgAnimFrame)dlgAnimFrame=requestAnimationFrame(animateDialogueScene);
}

function initSceneCanvas(){
  sceneCanvas=document.getElementById('dlg-scene-canvas');
  if(!sceneCanvas)return;
  sceneCtx=sceneCanvas.getContext('2d');
  const dpr=window.devicePixelRatio||1;
  // 用实际可用空间
  const maxW=Math.min(780,document.documentElement.clientWidth*.95);
  const maxH=Math.min(480,document.documentElement.clientHeight*.58);
  sceneW=maxW;sceneH=maxH;
  sceneCanvas.width=Math.floor(sceneW*dpr);
  sceneCanvas.height=Math.floor(sceneH*dpr);
  sceneCanvas.style.width=sceneW+'px';
  sceneCanvas.style.height=sceneH+'px';
  if(sceneCtx)sceneCtx.setTransform(dpr,0,0,dpr,0,0);
}

function advanceDialogue(){
  if(!currentDialogue)return;
  const dlg=currentDialogue;
  if(currentDialogueStep<dlg.lines.length){
    const line=dlg.lines[currentDialogueStep];
    document.getElementById('dlg-responses').innerHTML='';
    document.querySelector('.dlg-click-hint').style.display='block';
    currentDialogueStep++;
    renderDialogueScene();
    drawCurrentCharacter(line.expr||'neutral');
  }else if(document.getElementById('dlg-responses').children.length===0){
    // 只在第一次到达选项时渲染
    document.querySelector('.dlg-click-hint').style.display='none';
    document.getElementById('dlg-responses').innerHTML=dlg.responses.map((r,i)=>`
      <button class="dlg-resp-btn" onclick="chooseResponse(${i})">
        ${r.text}<span class="dr-hint">${r.hint}</span>
      </button>
    `).join('');
    renderDialogueScene();
  }
}

function chooseResponse(idx){
  const dlg=currentDialogue,resp=dlg.responses[idx];
  if(resp._scn){ finishScenario(resp._scn.scene, resp._scn.c); return; }
  let fx={...resp.fx};
  if(fx.stamina)fx.stamina=Math.round(fx.stamina*(1-(GS.toolUse-3)*.03));
  if(fx.mood&&GS.communication>4)fx.mood=Math.round(fx.mood*1.1);
  Object.entries(fx).forEach(([k,v])=>{
    if(k==='stamina')GS.stamina=clamp(GS.stamina+v,0,100);
    if(k==='mood')GS.mood=clamp(GS.mood+v,0,100);
    if(k==='money')GS.money=Math.round(Math.max(-999,GS.money+v));
    if(k==='confidence')GS.confidence=clamp(GS.confidence+v,0,100);
    if(k==='skill')GS.skill=clamp(GS.skill+v,0,100);
    if(k==='social')GS.social=clamp(GS.social+v,0,100);
    if(k==='independence')GS.independence=clamp(GS.independence+v,0,100);
  });
  if(!dlg._noTrack)addLog(`对话: ${dlg.speaker} — ${resp.text}`);
  if(dlg.id==='story_interview'){
    GS.storyFlags=GS.storyFlags||{};
    GS.storyFlags.interviewChoice=idx;
    GS.storyFlags.position=OFFER_POSITIONS[idx]||OFFER_POSITIONS[0];
  }
  const sb=STORY_BONDS[dlg.id]||dlg.bond;
  if(sb){GS.bonds=GS.bonds||{};GS.bonds[sb.npc]=clamp((GS.bonds[sb.npc]||0)+sb.amt,0,100);}
  checkBondMilestones();
  if(!dlg._noTrack){GS.triggeredDialogues.push(dlg.id);GS.totalEventsTriggered++;}
  closeDialogue();
  if(currentDialogueCallback)currentDialogueCallback();
  renderAll();saveGame();checkEndings();
}

function closeDialogue(){
  document.getElementById('dialogue-overlay').classList.add('hidden');
  document.getElementById('dlg-responses').innerHTML='';
  currentDialogue=null;currentDialogueStep=0;dlgEntrance=0;
  if(dlgAnimFrame){cancelAnimationFrame(dlgAnimFrame);dlgAnimFrame=null}
  sceneCtx=null;sceneCanvas=null;
  drawCurrentCharacter('neutral');
}

// 对话推进：点击canvas、overlay、或按键均可
let _dlgClickBound=false;
function ensureDlgClickHandler(){
  if(_dlgClickBound)return;_dlgClickBound=true;
  // Canvas点击
  const cv=document.getElementById('dlg-scene-canvas');
  if(cv)cv.addEventListener('click',handleDlgClick);
  // Overlay点击（兜底）
  const ov=document.getElementById('dialogue-overlay');
  if(ov)ov.addEventListener('click',function(e){
    if(e.target===ov||e.target===cv)handleDlgClick();
  });
  // 键盘
  document.addEventListener('keydown',function(e){
    if((e.key==='Enter'||e.key===' '||e.key==='ArrowRight')&&currentDialogue){
      e.preventDefault();advanceDialogue();
    }
  });
}
function handleDlgClick(){
  if(currentDialogue)advanceDialogue();
}
document.addEventListener('DOMContentLoaded',ensureDlgClickHandler);

// ---- 地点活动 ----
function fxSummary(fx){
  const label={stamina:'体力',mood:'心情',money:'金钱',confidence:'自信',skill:'专业',social:'社交',independence:'独立'};
  return Object.entries(fx||{}).map(([k,v])=>{
    const sign=v>0?'+':'';
    return (label[k]||k)+sign+v;
  }).join(' ');
}

function applyActivityFx(fx){
  Object.entries(fx||{}).forEach(([k,v])=>{
    if(k==='stamina')GS.stamina=clamp(GS.stamina+v,0,100);
    if(k==='mood')GS.mood=clamp(GS.mood+v,0,100);
    if(k==='money')GS.money=Math.round(Math.max(-999,GS.money+v));
    if(k==='confidence')GS.confidence=clamp(GS.confidence+v,0,100);
    if(k==='skill')GS.skill=clamp(GS.skill+v,0,100);
    if(k==='social')GS.social=clamp(GS.social+v,0,100);
    if(k==='independence')GS.independence=clamp(GS.independence+v,0,100);
  });
}

function doActivity(locId,actId){
  if(GS.gameOver)return;
  const acts=LOCATION_ACTIVITIES[locId]||[];
  const act=acts.find(a=>a.id===actId);
  if(!act)return;
  if((GS.doneActivities||{})[actId]===GS.day){showToast('今天已经做过这件事啦');return}
  if(GS.money<act.cost){showToast('💰 金钱不足！');return}
  if(act.cost)GS.money=Math.round(GS.money-act.cost);
  applyActivityFx(act.fx);
  // 天气对活动的提示反馈
  const wAct=WEATHERS[GS.weather]||WEATHERS.sunny;
  if(GS.weather!=='sunny')GS.mood=clamp(GS.mood+wAct.moodDrift,0,100);
  GS.doneActivities=GS.doneActivities||{};
  GS.doneActivities[actId]=GS.day;
  advanceTime(act.time);
  addLog(`在${LOCATIONS[locId].name}·${act.name}`);
  const parts=[fxSummary(act.fx)];
  if(act.cost)parts.push('💰-'+act.cost);
  if(GS.weather!=='sunny')parts.push(`${wAct.icon}${wAct.name}天 心情${wAct.moodDrift}`);
  showToast(act.icon+' '+act.name+'：'+parts.join(' · '));
  renderAll();saveGame();
  closeSceneCard();
  checkEndings();
  if(!GS.gameOver)setTimeout(()=>{
    if(GS.gameOver)return;
    if(!maybeNightReflection(()=>{setTimeout(maybeStartStory,50);})){
      maybeStartStory();
    }
    if(!maybeTriggerFriendEvent())maybeTriggerDialogue();
  },450);
}

function startScenario(locId, sceneId){
  if(GS.gameOver)return;
  const scene=(SCENARIOS[locId]||[]).find(s=>s.id===sceneId);
  if(!scene)return;
  if((GS.doneActivities||{})[scene.id]===GS.day){ showToast('今天已经体验过这个场景啦'); return; }
  if(GS.money<scene.cost){ showToast('💰 金钱不足！'); return; }
  if(scene.cost)GS.money=Math.round(GS.money-scene.cost);
  const lines=[];
  (scene.atmo||[]).forEach(t=>lines.push({text:t,who:'narrator',expr:'neutral'}));
  lines.push({text:scene.prompt,who:'narrator',expr:'neutral'});
  const dlg={id:scene.id,type:'scenario',speaker:scene.name,avatar:scene.icon||'📖',
    lines,
    responses:(scene.choices||[]).map(c=>({text:c.text,
      hint:`${c.desc}<br>⏱${SCEN_T(c.ok.time)}~${SCEN_T(c.no.time)}分钟${c.no.mood?(' · 失败心情'+c.no.mood):''}`,
      _scn:{scene,c}}))};
  startDialogue(dlg,function(){renderAll();saveGame();checkEndings();});
}

function finishScenario(scene,c){
  const abil=GS[c.ability]||3;
  const ok=Math.random()<scenarioRate(abil);
  const o=ok?c.ok:c.no;
  if(o.time)advanceTime(SCEN_T(o.time));
  if(o.mood){
    const moodDelta=(!ok&&scene.cost>0)?Math.max(o.mood,-1):o.mood;
    GS.mood=clamp(GS.mood+moodDelta,0,100);
  }
  if(ok&&scene.cost>0)GS.mood=clamp(GS.mood+2,0,100);
  if(ok&&SCEN_GROWTH[c.ability]){Object.entries(SCEN_GROWTH[c.ability]).forEach(([k,v])=>GS[k]=clamp(GS[k]+v,0,100));}
  // —— 类别首通里程碑（每类场景第一次完成时的一次性奖励）——
  const doneBefore=GS.doneActivities||{};
  const cat=['mall','happyvalley','longtravel'].find(k=>(SCENARIOS[k]||[]).some(s=>s.id===scene.id));
  const firstInCat=cat&&!(SCENARIOS[cat]||[]).some(s=>s.id!==scene.id&&doneBefore[s.id]);
  GS.doneActivities=GS.doneActivities||{};
  GS.doneActivities[scene.id]=GS.day;
  GS.scenariosDone=(GS.scenariosDone||0)+1;
  if(firstInCat&&CAT_BONUS[cat]){
    Object.entries(CAT_BONUS[cat].rewards).forEach(([k,v])=>GS[k]=clamp(GS[k]+v,0,100));
    const b=CAT_BONUS[cat].bond;
    if(b){GS.bonds=GS.bonds||{};GS.bonds[b.npc]=clamp((GS.bonds[b.npc]||0)+b.amt,0,100);}
    addLog(`里程碑·${CAT_BONUS[cat].msg}`);
  }
  addLog(`场景·${scene.name} — ${c.text}（${ok?'成功':'失败'}）`);
  const outDlg={id:scene.id+'_r',type:'scenario',_noTrack:true,speaker:scene.name,avatar:scene.icon||'📖',
    lines:[{text:o.text,who:'narrator',expr:ok?'happy':'sad'}],
    responses:[{text:'继续',fx:{},hint:ok?'成功':'失败'}]};
  startDialogue(outDlg,function(){renderAll();saveGame();checkEndings();
    if(!GS.gameOver)setTimeout(()=>{
      if(GS.gameOver)return;
      if(!maybeNightReflection(()=>{setTimeout(maybeStartStory,50);})){
        maybeStartStory();
      }
      if(!maybeTriggerFriendEvent())maybeTriggerDialogue();
    },450);});
}

// —— 成长路线选择（第三章·十字路口）——
const ROUTE_INTRO='转正之后，林薇把你叫进会议室。\n\n「小萤，这一个月你做得很好。」她推过来一份文件，「现在，公司愿意给你更大的空间。但路要怎么走，得你自己选。」\n\n窗外是城市的喧嚣。你握着导盲杖，心里清楚：这是你人生里，第一个真正由自己做的、关于「未来」的决定。';
function showRouteChoice(stage,callback){

function chooseRoute(id){

  addLog('🚦 你在人生的十字路口，选择了「'+r.name+'」这条路');

  const box=document.getElementById('route-choices');if(box)box.innerHTML='';

}
const OFFER_POSITIONS=['音频内容专员','无障碍体验顾问','无障碍测试专员'];
const STORY_BONDS={story_grad:{npc:'小雨',amt:10},story_wait:{npc:'小雨',amt:8},story_review:{npc:'小雨',amt:8},story_interview:{npc:'林薇',amt:10},story_offer:{npc:'林薇',amt:8},story_firstday:{npc:'阿凯',amt:10}};
function resolveStoryDialogue(dialogueId){
  // 第三章·选定方向 / 第四章·四条路线专属剧情，按玩家选择的成长路线分叉
  const ROUTE_DIALOGUES=['ch3_path','ch4_route','ch4_climax','ch4_finale'];
  if(ROUTE_DIALOGUES.includes(dialogueId)){
    const route=GS.growthRoute||'career';
    return STORY_DIALOGUES[dialogueId+'_'+route]||STORY_DIALOGUES[dialogueId+'_career'];
  }
  if(dialogueId!=='story_offer')return STORY_DIALOGUES[dialogueId];
  const choice=GS.storyFlags.interviewChoice;
  const key=choice===1?'story_offer_consultant':choice===2?'story_offer_tester':'story_offer_audio';
  return STORY_DIALOGUES[key];
}
const POSITION_SETUPS={
  '音频内容专员':'工位上已备好音频剪辑软件、读屏脚本和降噪耳机',
  '无障碍体验顾问':'工位上已备好视频会议工具、用户反馈看板和沟通辅助软件',
  '无障碍测试专员':'工位上已备好测试用例库、读屏脚本和自动化测试工具',
};
function prepareStoryDialogue(dlg){
  if(!dlg)return dlg;
  const pos=(GS.storyFlags&&GS.storyFlags.position)||'音频内容专员';
  const setup=POSITION_SETUPS[pos]||POSITION_SETUPS['音频内容专员'];
  return {...dlg,lines:(dlg.lines||[]).map(l=>({...l,text:l.text.replace(/\{position\}/g,pos).replace(/\{setup\}/g,setup)}))};
}
function startStoryStage(){
  if(GS.gameOver)return;
  const stage=STORY_STAGES[GS.storyStage];
  if(!stage)return;
  if(stage.type==='ending'){triggerEnding('story');return;}
  if(stage.type==='route'){showRouteChoice(stage,function(){GS.storyStage++;GS.storyTriggeredToday=true;renderAll();saveGame();setTimeout(()=>checkEndings(),100);});return;}
  if(stage.type==='free'){GS.freeMode=true;GS.storyTriggeredToday=true;addLog('🎉 主线剧情完成！进入自由养成阶段，继续生活与成长，随时点「🎓 结算」收尾');showToast('🎉 进入自由养成！随时点「🎓」结算收尾');renderAll();saveGame();return;}
  if(stage.type==='dialogue'){
    const dlg=prepareStoryDialogue(resolveStoryDialogue(stage.dialogueId));
    if(dlg){
      dlg.id=stage.dialogueId;
      startDialogue(dlg,function(){
        GS.storyStage++;GS.storyTriggeredToday=true;
        renderAll();saveGame();
        setTimeout(()=>{
          checkEndings();
          if(!GS.gameOver&&STORY_STAGES[GS.storyStage]&&STORY_STAGES[GS.storyStage].type==='ending')startStoryStage();
        },100);
      });
    }else{GS.storyStage++;startStoryStage();}
  }else if(stage.type==='narrate'){
    showStoryNarrate(stage,function(){
      GS.storyStage++;GS.storyTriggeredToday=true;
      renderAll();saveGame();
      setTimeout(()=>checkEndings(),100);
    });
  }
}
function maybeStartStory(){
  if(GS.gameOver)return false;
  if(GS.freeMode)return false;
  if(GS.storyTriggeredToday)return false;
  const stage=STORY_STAGES[GS.storyStage];
  if(!stage)return false;
  if(GS.day>=stage.day){
    GS.storyTriggeredToday=true;
    startStoryStage();
    return true;
  }
  return false;
}
function clickStory(){
  if(GS.gameOver)return;
  if(GS.freeMode){showToast('🎉 主线已完结，现在是自由养成，随时点「🎓」结算收尾');return;}
  const stage=STORY_STAGES[GS.storyStage];
  if(!stage)return;
  if(GS.day<stage.day){showToast(`「${stage.label}」要到第 ${stage.day} 天才会触发，先过完今天`);return;}
  if(GS.storyTriggeredToday){showToast('今天的剧情已经进行过了，去探索城市吧');return;}
  maybeStartStory();
}

let canvas2,ctx2,mw,mh;

function initMap(){
  canvas2=document.getElementById('map-canvas2');
  ctx2=canvas2.getContext('2d');
  resizeMap2();
  window.addEventListener('resize',resizeMap2);
  canvas2.addEventListener('click',handleMapClick2);
  canvas2.addEventListener('mousemove',handleMapHover2);
  canvas2.style.cursor='default';
  particles2=[];
  if(!animFrame2)animateMap2();
}

function resizeMap2(){
  const wrap=document.getElementById('map-wrap');
  const rect=wrap.getBoundingClientRect();
  const dpr=window.devicePixelRatio||1;
  mw=rect.width;mh=rect.height;
  canvas2.width=mw*dpr;canvas2.height=mh*dpr;
  canvas2.style.width=mw+'px';canvas2.style.height=mh+'px';
  ctx2.setTransform(dpr,0,0,dpr,0,0);
  buildMapData2();
}

function buildMapData2(){
  const locs={};
  Object.values(LOCATIONS).forEach(loc=>{locs[loc.id]={x:loc.cx*mw,y:loc.cy*mh,...loc}});
  const roads=[
    {from:locs.home,to:locs.busstop},{from:locs.busstop,to:locs.station},
    {from:locs.busstop,to:locs.mall},{from:locs.mall,to:locs.shop},
    {from:locs.station,to:locs.hospital},{from:locs.mall,to:locs.hospital},
    {from:locs.home,to:locs.community},{from:locs.community,to:locs.park},
    {from:locs.busstop,to:locs.park},{from:locs.park,to:locs.library},
    {from:locs.mall,to:locs.library},{from:locs.library,to:locs.cafe},
    {from:locs.cafe,to:locs.shop},
    {from:locs.bank,to:locs.home},{from:locs.bank,to:locs.library},
    {from:locs.pharmacy,to:locs.hospital},{from:locs.pharmacy,to:locs.shop},
    {from:locs.park,to:locs.happyvalley},{from:locs.station,to:locs.happyvalley},
    {from:locs.station,to:locs.longtravel},{from:locs.hospital,to:locs.longtravel},
  ];
  mapData2={locs,roads};
}

function animateMap2(){
  if(!GS||GS.gameOver){animFrame2=null;return}
  drawMap2();updateParticles2();drawParticles2();
  animFrame2=requestAnimationFrame(animateMap2);
}

function drawMap2(){
  const d=mapData2;if(!d)return;
  ctx2.clearRect(0,0,mw,mh);
  ctx2.fillStyle='#1a2a1e';ctx2.fillRect(0,0,mw,mh);

  // 草地纹理
  ctx2.fillStyle='#1f3022';
  for(let i=0;i<150;i++){ctx2.beginPath();ctx2.arc((i*137+42)%mw,(i*251+17)%mh,1,0,Math.PI*2);ctx2.fill()}

  // 公园
  ctx2.fillStyle='#1e3422';
  ctx2.beginPath();ctx2.ellipse(mw*.5,mh*.72,mw*.12,mh*.1,0,0,Math.PI*2);ctx2.fill();

  // 树木
  [[.12,.72],[.10,.68],[.16,.74],[.48,.65],[.52,.68],[.50,.72],[.72,.82],[.75,.85],[.68,.84],[.30,.30],[.33,.26],[.60,.20],[.63,.23],[.85,.33],[.82,.30]].forEach(([tx,ty])=>{
    const x=tx*mw,y=ty*mh,sway=Math.sin(Date.now()*.001+x*.01)*1.5;
    ctx2.fillStyle='#3a6640';ctx2.beginPath();ctx2.arc(x+sway,y-5,7,0,Math.PI*2);ctx2.fill();
    ctx2.fillStyle='#4a7a52';ctx2.beginPath();ctx2.arc(x+sway+2,y-7,5,0,Math.PI*2);ctx2.fill();
    ctx2.fillStyle='#5a4a3a';ctx2.fillRect(x-1,y-1,2,7);
  });

  // 道路
  d.roads.forEach(r=>{
    ctx2.strokeStyle='#3d3d56';ctx2.lineWidth=20;ctx2.lineCap='round';
    ctx2.beginPath();ctx2.moveTo(r.from.x,r.from.y);ctx2.lineTo(r.to.x,r.to.y);ctx2.stroke();
    ctx2.strokeStyle='#4a4a60';ctx2.lineWidth=2;ctx2.setLineDash([6,10]);
    ctx2.beginPath();ctx2.moveTo(r.from.x,r.from.y);ctx2.lineTo(r.to.x,r.to.y);ctx2.stroke();
    ctx2.setLineDash([]);
  });

  // 路灯
  d.roads.forEach(r=>{
    const dx=r.to.x-r.from.x,dy=r.to.y-r.from.y,dist=Math.sqrt(dx*dx+dy*dy);
    for(let i=1;i<Math.floor(dist/35);i++){
      const t=i/Math.floor(dist/35),lx=r.from.x+dx*t,ly=r.from.y+dy*t;
      ctx2.fillStyle=`rgba(244,196,96,${.12+Math.sin(Date.now()*.003+i)*.04})`;
      ctx2.beginPath();ctx2.arc(lx+8,ly-8,5,0,Math.PI*2);ctx2.fill();
      ctx2.fillStyle='#f4c460';ctx2.beginPath();ctx2.arc(lx+8,ly-8,1.5,0,Math.PI*2);ctx2.fill();
    }
  });

  // 建筑
  Object.values(d.locs).forEach(loc=>{
    const{x,y,id}=loc,isCur=GS.currentLocation===id,isSel=GS.selectedDest===id;
    ctx2.fillStyle='rgba(0,0,0,.3)';ctx2.fillRect(x-14,y-14,30,30);
    const grad=ctx2.createLinearGradient(x-12,y-12,x+12,y+12);
    grad.addColorStop(0,'#3a3a58');grad.addColorStop(1,'#252540');
    ctx2.fillStyle=grad;roundRect2(x-12,y-12,24,24,5);ctx2.fill();
    ctx2.strokeStyle=isSel?'#f0c060':(isCur?'#7ac870':'#4a4a68');
    ctx2.lineWidth=isSel?2.5:(isCur?2:1);
    roundRect2(x-12,y-12,24,24,5);ctx2.stroke();
    ctx2.fillStyle=isCur?'#f4d080':'#f4c060';
    ctx2.globalAlpha=.5+Math.sin(Date.now()*.002+x)*.2;
    ctx2.fillRect(x-7,y-7,4,4);ctx2.fillRect(x+2,y-7,4,4);ctx2.fillRect(x-7,y+2,4,4);
    ctx2.globalAlpha=1;
    if(isCur){ctx2.fillStyle='rgba(122,200,112,.12)';ctx2.beginPath();ctx2.arc(x,y,20,0,Math.PI*2);ctx2.fill()}
    if(isSel){const p=.4+Math.sin(Date.now()*.006)*.2;ctx2.strokeStyle=`rgba(240,192,96,${p})`;ctx2.lineWidth=3;roundRect2(x-14,y-14,28,28,7);ctx2.stroke()}
    ctx2.fillStyle='#e0d8c8';ctx2.font=`${isCur?14:12}px sans-serif`;ctx2.textAlign='center';ctx2.textBaseline='middle';
    ctx2.fillText(loc.icon,x,y);
    ctx2.fillStyle='rgba(200,180,150,.8)';ctx2.font='9px "Microsoft YaHei",sans-serif';ctx2.fillText(loc.name,x,y+21);
  });

  // 角色光点
  const cl=mapData2.locs[GS.currentLocation];if(cl){
    let cx=cl.x,cy=cl.y;
    if(window._moveAnim){
      const p=Math.min(1,(Date.now()-window._moveAnim.start)/window._moveAnim.dur);
      if(p<1){cx=window._moveAnim.fx+(window._moveAnim.tx-window._moveAnim.fx)*easeInOutCubic2(p);cy=window._moveAnim.fy+(window._moveAnim.ty-window._moveAnim.fy)*easeInOutCubic2(p)}
      else window._moveAnim=null;
    }
    ctx2.fillStyle='rgba(244,164,64,.22)';ctx2.beginPath();ctx2.arc(cx,cy,9,0,Math.PI*2);ctx2.fill();
    const cg=ctx2.createRadialGradient(cx-1,cy-1,1,cx,cy,4);
    cg.addColorStop(0,'#fff');cg.addColorStop(.4,'#f4c060');cg.addColorStop(1,'#c08030');
    ctx2.fillStyle=cg;ctx2.beginPath();ctx2.arc(cx,cy,4,0,Math.PI*2);ctx2.fill();
    ctx2.strokeStyle='rgba(255,255,255,.35)';ctx2.lineWidth=1;ctx2.beginPath();ctx2.arc(cx,cy,4,0,Math.PI*2);ctx2.stroke();
  }

  // 天气氛围
  if(GS.weather==='rain'){
    ctx2.fillStyle='rgba(60,80,110,.12)';ctx2.fillRect(0,0,mw,mh);
    ctx2.strokeStyle='rgba(170,190,220,.16)';ctx2.lineWidth=1;
    for(let i=0;i<30;i++){
      const rx=(i*137+33)%mw,ry=(Date.now()*.06+i*97)%mh;
      ctx2.beginPath();ctx2.moveTo(rx,ry);ctx2.lineTo(rx-1.5,ry+9);ctx2.stroke();
    }
  }else if(GS.weather==='wind'){
    ctx2.fillStyle='rgba(200,210,180,.04)';ctx2.fillRect(0,0,mw,mh);
  }

  if(Math.random()<.25)particles2.push({x:Math.random()*mw,y:Math.random()*mh*.5,life:1,size:Math.random()*2+1,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3-.2});
}

function updateParticles2(){for(let i=particles2.length-1;i>=0;i--){const p=particles2[i];p.x+=p.vx;p.y+=p.vy;p.life-=.008;if(p.life<=0)particles2.splice(i,1)}}
function drawParticles2(){particles2.forEach(p=>{ctx2.fillStyle=`rgba(244,196,96,${p.life*.35})`;ctx2.beginPath();ctx2.arc(p.x,p.y,p.size,0,Math.PI*2);ctx2.fill()})}
function easeInOutCubic2(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2}
function roundRect2(x,y,w,h,r){ctx2.beginPath();ctx2.moveTo(x+r,y);ctx2.lineTo(x+w-r,y);ctx2.arcTo(x+w,y,x+w,y+r,r);ctx2.lineTo(x+w,y+h-r);ctx2.arcTo(x+w,y+h,x+w-r,y+h,r);ctx2.lineTo(x+r,y+h);ctx2.arcTo(x,y+h,x,y+h-r,r);ctx2.lineTo(x,y+r);ctx2.arcTo(x,y,x+r,y,r);ctx2.closePath()}

function handleMapClick2(e){
  if(!mapData2||!GS||GS.gameOver)return;
  const rect=canvas2.getBoundingClientRect(),mx=e.clientX-rect.left,my=e.clientY-rect.top;
  let clicked=null,md=22;
  Object.values(mapData2.locs).forEach(l=>{const d=Math.hypot(mx-l.x,my-l.y);if(d<md){md=d;clicked=l}});
  if(clicked&&clicked.id!==GS.currentLocation){GS.selectedDest=clicked.id;showToast('📍 目的地：'+clicked.name)}
}
function handleMapHover2(e){
  if(!mapData2)return;
  const rect=canvas2.getBoundingClientRect(),mx=e.clientX-rect.left,my=e.clientY-rect.top;
  let h=false;Object.values(mapData2.locs).forEach(l=>{if(Math.hypot(mx-l.x,my-l.y)<20)h=true});
  canvas2.style.cursor=h?'pointer':'default';
}

function startTravel(){
  if(!GS.selectedDest){showToast('👆 请先在地图上点击目的地');return}
  if(GS.selectedDest===GS.currentLocation){showToast('你已经在这里了');return}
  if(GS.gameOver)return;

  const tId=document.getElementById('sel-transport').value;
  const t=TRANSPORT[tId],load=calcLoad(),lf=1+load/20;
  const weather=WEATHERS[GS.weather]||WEATHERS.sunny;
  const indoor=!!t.indoor;
  const staminaCost=Math.round(t.stamina*lf*(indoor?1:weather.staminaMul));
  const timeMin=Math.round((t.timeMin+t.timeMax)/2*lf);
  // 天气对出行的提示反馈
  if(GS.weather!=='sunny'){
    if(indoor){
      addLog(`🚕 打车避雨，免受${weather.name}天体力与心情影响`);
      showToast('🚕 打车出行：坐车避雨，体力与心情不受天气影响');
    }else{
      const pct=Math.round((weather.staminaMul-1)*100);
      const moodTxt=weather.moodDrift<0?`心情${weather.moodDrift}`:`心情+${weather.moodDrift}`;
      addLog(`${weather.icon} ${weather.name}天出行：体力消耗 +${pct}%，${moodTxt}`);
      if(GS.weather==='rain'){
        showToast('🌧️ 雨天导盲难度上升：雨声干扰听觉、地面湿滑，请多加小心');
      }else if(GS.weather==='wind'){
        showToast('💨 风天出行：气流与杂物会干扰听觉判断，注意安全');
      }
    }
  }
  if(GS.money+t.money<0){showToast('💰 金钱不足！');return}

  const originId=GS.currentLocation,originName=LOCATIONS[originId].name;
  const destId=GS.selectedDest,destName=LOCATIONS[destId].name;
  const fromLoc=mapData2.locs[originId],toLoc=mapData2.locs[destId];

  GS.money+=t.money;GS.stamina+=staminaCost;GS.stamina=clamp(GS.stamina,0,100);GS.money=Math.round(GS.money);GS.mood=clamp(GS.mood+((indoor?0:weather.moodDrift)||0),0,100);
  advanceTime(timeMin);
  GS.currentLocation=destId;GS.travelsCompleted++;GS.selectedDest=null;
  GS.visitedLocations=GS.visitedLocations||[];
  if(!GS.visitedLocations.includes(destId))GS.visitedLocations.push(destId);

  if(fromLoc&&toLoc){window._moveAnim={fx:fromLoc.x,fy:fromLoc.y,tx:toLoc.x,ty:toLoc.y,start:Date.now(),dur:Math.min(1500,timeMin*35)}}

  addLog(`从${originName}乘坐${t.name}到达${destName}`);

  // 检查是否需要立刻结局（跳过场景卡）
  if(GS.stamina<=0||GS.mood<=0||GS.money<0){
    renderAll();saveGame();checkEndings();return;
  }

  // 先显示场景卡
  showSceneCard(destId,()=>{
    renderAll();saveGame();
    const eventDelay=600;
    if(!GS.gameOver){
      if(!maybeNightReflection(()=>{setTimeout(maybeStartStory,50);})){
        maybeStartStory();
      }
      setTimeout(()=>{
        if(GS.gameOver)return;
        const storyOpen = !document.getElementById('story-overlay').classList.contains('hidden') ||
                          !document.getElementById('dialogue-overlay').classList.contains('hidden');
        if(!storyOpen)maybeTriggerDialogue(tId);
      },eventDelay);
    }
    setTimeout(()=>checkEndings(),eventDelay+200);
  });

  renderAll();saveGame();
}

function advanceTime(minutes){
  GS.time+=minutes;
  while(GS.time>=1200){
    GS.time=480+(GS.time-1200);GS.day++;GS.stamina=Math.min(100,GS.stamina+35);GS.mood=clamp(GS.mood+3,0,100);GS.storyTriggeredToday=false;
    GS.pendingReflection=true;
    rollDailyGoal();
    rollWeather();
    const w=WEATHERS[GS.weather]||WEATHERS.sunny;
    addLog('🌅 新的一天！今天'+w.name);
  }
}

function checkDailyGoal(){

function maybeTriggerFriendEvent(){
  if(GS.gameOver)return false;
  const fe=(FRIEND_EVENTS||[]).find(e=>e.day===GS.day && !(GS.triggeredDialogues||[]).includes(e.id));
  if(!fe)return false;
  startDialogue(fe,()=>{renderAll();saveGame();checkEndings();});
  return true;
}

function maybeTriggerDialogue(transport){
  const t=TRANSPORT[transport]||TRANSPORT.walk,baseRate=t.eventRate;
  const pBonus=(GS.perception-3)*.05,lPenalty=calcLoad()>10?.1:0;
  const rate=clamp(baseRate+pBonus-lPenalty,.1,.9);
  if(Math.random()<rate){
    const dlg=selectDialogue();if(dlg)startDialogue(dlg,()=>{renderAll();saveGame();checkEndings()});
  }
}

function selectDialogue(){
  const eligible=DIALOGUES.filter(d=>{
    if(d.minDay&&GS.day<d.minDay)return false;
    if(d.cond){try{if(!d.cond())return false}catch(e){return false}}
    return true;
  });
  const fresh=eligible.filter(d=>!GS.triggeredDialogues.includes(d.id));
  const pool=fresh.length>0?fresh:eligible;
  let candidates=pool;
  // 连锁小故事优先：可推进的 arc 事件有较高概率抢先触发
  let arcPool=pool.filter(d=>d.arc);
  if(GS.freeMode){
    // 自由模式下：优先补齐还没走完的故事线，方便多周目集齐
    const arcName=id=>id.replace(/^arc_/,'').replace(/\d+$/,'');
    const ARC_FINAL={cat:3,metro:2,road:3,nei:3,tra:3,sou:3,dia:3,food:3,fam:3,plant:3,music:3,hos:3};
    const td=GS.triggeredDialogues||[];
    const unfinished=arcPool.filter(d=>{
      const n=arcName(d.id),fin=ARC_FINAL[n];
      return !fin||!td.includes('arc_'+n+fin);
    });
    if(unfinished.length>0)arcPool=unfinished;
  }
  if(arcPool.length>0&&Math.random()<.85){
    return arcPool[Math.floor(Math.random()*arcPool.length)];
  }
  // 地点联动：当前地点专属的事件优先触发
  const locMatch=pool.filter(d=>d.location===GS.currentLocation);
  if(locMatch.length>0&&Math.random()<.5){
    candidates=locMatch;
  }else{
    // 天气联动：当前天气匹配的事件优先触发
    const weatherMatch=pool.filter(d=>d.weather===GS.weather);
    if(weatherMatch.length>0&&Math.random()<.5){
      candidates=weatherMatch;
    }else if(GS.mood<40){
      const pos=pool.filter(d=>d.type==='positive');if(pos.length>0&&Math.random()<.4)candidates=pos;
    }
  }
  return candidates[Math.floor(Math.random()*candidates.length)];
}
